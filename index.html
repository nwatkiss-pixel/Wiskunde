<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071f2c">
<title>Die Geheim van Baviaaneiland — Wiskunde Graad 6</title>
<style>
/* ============================================================
   DIE GEHEIM VAN BAVIAANEILAND / THE SECRET OF BABOON ISLAND
   Graad 6 Wiskunde — Sistemiese voorbereiding
   Enkellêer-speletjie. Geen internet nodig.
   ============================================================ */

:root{
  --sea-deep:#071f2c;
  --sea:#0e3a4d;
  --sea-light:#17566b;
  --timber:#3a2415;
  --plank:#6b4526;
  --plank-light:#8a5c34;
  --parchment:#efdfbb;
  --parchment-dark:#d8c294;
  --ink:#2b1a0d;
  --brass:#e0a828;
  --brass-dark:#a87a16;
  --foam:#3fb8a0;
  --coral:#d2553c;
  --moon:#f4ecd8;
  --shadow:rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{max-width:100%;overflow-x:hidden}

html,body{margin:0;padding:0;min-height:100%}

body{
  background:var(--sea-deep);
  background-image:
    radial-gradient(ellipse at 50% 0%, #14455c 0%, #071f2c 65%);
  color:var(--moon);
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  font-size:17px;
  line-height:1.5;
  padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  display:flex;
  justify-content:center;
}

.stage{width:100%;max-width:960px}

/* ---------- top bar ---------- */
.topbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:linear-gradient(180deg,var(--plank-light),var(--plank));
  border:3px solid var(--timber);
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:10px;
  box-shadow:0 4px 0 var(--timber);
}
.brandmark{font-family:Georgia,"Palatino Linotype",serif;font-weight:bold;font-size:18px;color:var(--parchment);letter-spacing:.5px;margin-right:auto}
.brandmark span{display:block;font-size:12px;font-weight:normal;color:var(--parchment-dark);letter-spacing:2px}

.stat{
  background:var(--timber);border:2px solid #21140a;border-radius:6px;
  padding:5px 9px;font-size:15px;font-weight:bold;color:var(--parchment);
  min-height:34px;display:flex;align-items:center;gap:5px;white-space:nowrap
}

button{font-family:inherit;font-size:inherit;cursor:pointer}
.btn,.opt,.island,.badge,.shop-item button{
  touch-action:manipulation;              /* removes the 300 ms tap delay */
  -webkit-user-select:none;user-select:none;
  min-height:44px;min-width:44px
}

.btn{
  background:linear-gradient(180deg,var(--brass),var(--brass-dark));
  color:var(--ink);border:2px solid #6d4c08;border-radius:8px;
  font-weight:bold;padding:11px 16px;min-height:44px;
  box-shadow:0 3px 0 #6d4c08;
  transition:transform .08s ease
}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:0 0 0 #6d4c08;filter:brightness(1.08)}
.btn.quiet{background:linear-gradient(180deg,var(--plank-light),var(--plank));color:var(--parchment);border-color:var(--timber);box-shadow:0 3px 0 var(--timber)}
.btn.small{padding:8px 12px;font-size:15px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.island:focus-visible{outline:3px solid var(--foam);outline-offset:3px}

/* ---------- panels ---------- */
.screen{display:none}
.screen.on{display:block}

.panel{
  background:linear-gradient(180deg,#0f3d51,#0a2c3c);
  border:3px solid var(--timber);border-radius:10px;
  padding:16px;margin-bottom:10px;
  box-shadow:0 5px 0 var(--timber)
}

.scene{
  position:relative;border:3px solid var(--timber);border-radius:10px;
  overflow:hidden;background:var(--sea);box-shadow:0 5px 0 var(--timber)
}
.scene svg{display:block;width:100%;height:auto}

/* ---------- dialogue bar (SCUMM-style) ---------- */
.dialogue{
  background:var(--parchment);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 2px,transparent 2px 5px);
  color:var(--ink);
  border:3px solid var(--timber);border-top:none;
  border-radius:0 0 10px 10px;
  padding:14px 16px;
  font-family:Georgia,"Palatino Linotype",serif;
  font-size:17px;line-height:1.55;
  min-height:76px;
  box-shadow:0 5px 0 var(--timber);
  margin-bottom:14px
}
.dialogue .who{display:block;font-family:"Trebuchet MS",sans-serif;font-size:13px;font-weight:bold;letter-spacing:1px;color:#7a4a1c;margin-bottom:3px}
.scene + .dialogue{border-radius:0 0 10px 10px;margin-top:-3px}

/* ---------- title screen ---------- */
.title-wrap{text-align:center;padding:14px 8px 4px}
.title-main{
  font-family:Georgia,"Palatino Linotype",serif;
  font-size:clamp(30px,7.5vw,58px);line-height:1.05;
  color:var(--brass);margin:0;
  text-shadow:0 3px 0 #6d4c08, 0 6px 14px rgba(0,0,0,.6)
}
.title-sub{font-size:clamp(14px,3vw,19px);color:var(--parchment-dark);margin:10px 0 0;letter-spacing:1px}

.field{display:block;margin:16px auto 6px;max-width:340px;text-align:left;font-size:15px;color:var(--parchment-dark)}
input[type=text]{
  width:100%;max-width:340px;padding:12px;font-size:18px;font-family:inherit;
  border:3px solid var(--timber);border-radius:8px;background:var(--parchment);color:var(--ink)
}

/* ---------- map ---------- */
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.island{
  text-align:left;background:linear-gradient(180deg,#155168,#0c374a);
  border:3px solid var(--timber);border-radius:10px;padding:12px;
  color:var(--moon);box-shadow:0 4px 0 var(--timber);
  display:flex;gap:10px;align-items:flex-start;min-height:92px
}
.island:active,.island.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--timber);border-color:var(--brass)}
.island.locked{opacity:.55;cursor:not-allowed;filter:grayscale(.5)}
.island.done{border-color:var(--brass)}
.island-icon{width:52px;height:52px;flex:0 0 52px}
.island h3{margin:0 0 3px;font-size:17px;font-family:Georgia,serif;color:var(--parchment)}
.island p{margin:0;font-size:13px;color:#a9c9d4}
.stars{font-size:15px;color:var(--brass);letter-spacing:2px;margin-top:4px}

/* ---------- question ---------- */
.qcard{background:var(--parchment);color:var(--ink);border:3px solid var(--timber);border-radius:10px;padding:16px;box-shadow:0 5px 0 var(--timber)}
.qmeta{font-size:13px;font-weight:bold;letter-spacing:1px;color:#7a4a1c;margin-bottom:6px}
.qtext{font-size:20px;line-height:1.45;font-family:Georgia,"Palatino Linotype",serif;margin:0 0 12px}
.qfig{text-align:center;margin:0 0 14px}
.qfig svg{max-width:100%;height:auto}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{
  display:flex;align-items:center;gap:10px;text-align:left;
  background:#fffaf0;border:3px solid var(--plank);border-radius:8px;
  padding:12px;min-height:56px;font-size:18px;color:var(--ink);
  font-family:inherit;box-shadow:0 3px 0 var(--plank)
}
.opt:active,.opt.pressed{transform:translateY(3px);box-shadow:0 0 0 var(--plank);background:#f6ead2}
.opt.pressed .letter{background:var(--brass-dark)}
.opt .letter{
  flex:0 0 32px;height:32px;border-radius:50%;background:var(--plank);color:var(--parchment);
  display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px
}
.opt.right{background:#d8f2e9;border-color:var(--foam);box-shadow:0 3px 0 var(--foam)}
.opt.right .letter{background:var(--foam)}
.opt.wrong{background:#f6dcd6;border-color:var(--coral);box-shadow:0 3px 0 var(--coral)}
.opt.wrong .letter{background:var(--coral)}
.opt[disabled]{cursor:default}
.opt.pick{justify-content:center;min-height:62px}
.opt.pick .letter{flex:0 0 46px;width:46px;height:46px;font-size:22px}

.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.qbar .spacer{margin-left:auto}

/* ---------- feedback ---------- */
.verdict{margin-top:14px;border-radius:8px;padding:12px 14px;border:3px solid;font-size:17px}
.verdict.good{background:#d8f2e9;border-color:var(--foam);color:#0d4f42}
.verdict.bad{background:#f6dcd6;border-color:var(--coral);color:#6d2114}
.verdict.hint{background:#fdf0cf;border-color:var(--brass-dark);color:#5a3f06}
.verdict .vhead{font-weight:bold;display:block;margin-bottom:3px}

/* ---------- duel ---------- */
.duel-bars{display:flex;gap:12px;margin-bottom:10px}
.hpwrap{flex:1}
.hpwrap span{font-size:13px;font-weight:bold;letter-spacing:1px}
.hp{height:16px;border:2px solid var(--timber);border-radius:8px;background:#062230;overflow:hidden}
.hp i{display:block;height:100%;background:var(--foam);transition:width .3s}
.hp.foe i{background:var(--coral)}

/* ---------- shop / cabin ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.shop-item{background:#0c374a;border:3px solid var(--timber);border-radius:10px;padding:10px;text-align:center}
.shop-item svg{width:64px;height:64px}
.shop-item h4{margin:4px 0;font-size:15px;color:var(--parchment)}
.owned{color:var(--foam);font-weight:bold;font-size:14px}

/* ---------- teacher ---------- */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border:2px solid var(--timber);padding:7px 9px;text-align:left}
th{background:var(--plank);color:var(--parchment)}
td{background:#0c374a}
.qlist{max-height:340px;overflow:auto;border:3px solid var(--timber);border-radius:8px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  border-radius:8px;padding-bottom:2px}
.qfig{max-width:100%}
.qfig svg{max-width:100%;height:auto}
.qlist table{font-size:13px}

/* ---------- certificate ---------- */
.cert{background:var(--parchment);color:var(--ink);border:10px double var(--brass-dark);border-radius:6px;padding:26px;text-align:center}
.cert h2{font-family:Georgia,serif;font-size:30px;margin:0 0 4px;color:#6d4c08}
.cert .name{font-family:Georgia,serif;font-size:27px;margin:14px 0;border-bottom:3px solid var(--plank);display:inline-block;padding:0 22px 4px}
.cert table{max-width:430px;margin:16px auto;font-size:15px}
.cert td,.cert th{border-color:var(--plank);background:#f8f1de;color:var(--ink)}
.cert th{background:var(--parchment-dark);color:var(--ink)}

/* stacked fractions */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.08;margin:0 3px;font-size:.82em}
.fr i{font-style:normal;border-bottom:2px solid currentColor;padding:0 5px}
.fr b{padding:0 5px}

h2.head{font-family:Georgia,serif;color:var(--brass);margin:0 0 10px;font-size:25px}
h3.sub{font-family:Georgia,serif;color:var(--parchment);margin:18px 0 8px;font-size:19px}
.note{font-size:14px;color:#a9c9d4}

.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--brass);color:var(--ink);font-weight:bold;
  border:3px solid var(--brass-dark);border-radius:8px;padding:10px 18px;
  box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:50;max-width:92vw;text-align:center
}


/* ---------- intro sequence ---------- */
#scr-intro{position:relative}
.intro{
  position:relative;overflow:hidden;min-height:clamp(380px,72vh,620px);
  border:3px solid var(--timber);border-radius:10px;box-shadow:0 5px 0 var(--timber);
  background:radial-gradient(ellipse at 50% 20%,#14455c 0%,#061c28 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px 20px
}
.intro .sym{
  position:absolute;color:#7fd4c4;opacity:0;font-family:Georgia,serif;
  font-size:26px;pointer-events:none;user-select:none;
  animation:drift 9s linear infinite
}
@keyframes drift{
  0%{opacity:0;transform:translateY(24px) rotate(0deg)}
  18%{opacity:.34}
  82%{opacity:.34}
  100%{opacity:0;transform:translateY(-120px) rotate(12deg)}
}
.intro-grid{position:absolute;inset:0;opacity:.12;
  background-image:linear-gradient(#9fd8d0 1px,transparent 1px),linear-gradient(90deg,#9fd8d0 1px,transparent 1px);
  background-size:44px 44px}
.intro-inner{position:relative;z-index:2;max-width:640px}
.beat{opacity:0;animation:riseIn .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.beat.out{animation:fadeOut .7s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
.intro-eyebrow{font-size:15px;letter-spacing:3px;color:var(--parchment-dark);margin:0 0 20px}
.intro-name{font-family:Georgia,"Palatino Linotype",serif;font-size:clamp(25px,5.4vw,38px);
  color:var(--brass);margin:0;line-height:1.15;text-shadow:0 2px 0 #6d4c08}
.intro-role{font-size:16px;color:var(--parchment);margin:4px 0 26px;letter-spacing:.4px}
.intro-ded{font-family:Georgia,serif;font-size:clamp(16px,2.8vw,20px);color:var(--parchment);
  line-height:1.6;max-width:30em;margin:0 auto}
.intro-rule{width:120px;height:3px;background:var(--brass);margin:22px auto;border-radius:2px;opacity:.8}
.intro-skip{position:absolute;right:14px;bottom:14px;z-index:3}
.intro-dots{position:absolute;left:0;right:0;bottom:18px;z-index:3;display:flex;gap:7px;justify-content:center}
.intro-dots i{width:9px;height:9px;border-radius:50%;background:var(--parchment-dark);opacity:.35;display:block}
.intro-dots i.on{opacity:1;background:var(--brass)}
.fading{animation:fadeOut .6s ease forwards}

/* ---------- modal (teacher password) ---------- */
.modal-back{position:fixed;inset:0;background:rgba(4,16,24,.82);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:linear-gradient(180deg,#0f3d51,#0a2c3c);border:3px solid var(--timber);
  border-radius:10px;box-shadow:0 6px 0 var(--timber);padding:20px;max-width:390px;width:100%}
.modal h3{font-family:Georgia,serif;color:var(--brass);margin:0 0 6px;font-size:21px}
.modal p{font-size:15px;color:#bcd6de;margin:0 0 14px}
.modal input{letter-spacing:8px;text-align:center;font-size:24px}
.modal .err{color:#ffb4a2;font-size:15px;font-weight:bold;min-height:22px;margin:8px 0 0}

/* ---------- badges ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.badge{background:#0c374a;border:3px solid var(--timber);border-radius:10px;padding:10px 8px;text-align:center}
.badge.got{border-color:var(--brass);background:#12455c}
.badge .bi{font-size:28px;line-height:1.1}
.badge .bn{font-size:13px;color:var(--parchment);margin-top:4px}
.badge.locked{opacity:.42;filter:grayscale(1)}
.bar{height:14px;border:2px solid var(--timber);border-radius:7px;background:#062230;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--brass)}
.toggle[aria-pressed="true"]{background:linear-gradient(180deg,var(--foam),#2a8a78);color:#052a24;border-color:#1c6558;box-shadow:0 3px 0 #1c6558}

/* ============================================================
   TOUCH AND SMALL-SCREEN LAYOUT
   Phones in portrait, tablets, and phones turned sideways.
   ============================================================ */
@media (max-width:760px){
  .map-grid{grid-template-columns:1fr}
  .qbar .btn{flex:1 1 auto}
  .qbar{gap:10px}
}

@media (max-width:560px){
  body{font-size:16px;padding:6px calc(6px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left))}

  /* top bar: name on its own line, controls in a comfortable row */
  .topbar{padding:7px 8px;gap:6px}
  .brandmark{font-size:17px;flex:1 0 100%;margin-right:0}
  .brandmark span{font-size:12px;letter-spacing:1.5px}
  .stat{font-size:16px;padding:6px 10px;min-height:44px}
  .topbar .btn.small{padding:8px 12px;min-width:48px}

  /* panels and cards breathe less, so more of the question fits */
  .panel,.qcard{padding:13px}
  .scene svg{height:40vw;min-height:104px;max-height:210px}

  /* SCUMM dialogue bar */
  .dialogue{padding:12px 13px;font-size:16.5px;min-height:0;line-height:1.5}
  .dialogue .who{font-size:12.5px}

  /* questions */
  .qmeta{font-size:12.5px}
  .qtext{font-size:clamp(18px,4.8vw,21px);line-height:1.4}
  .qfig{margin-bottom:12px}
  .opts{grid-template-columns:1fr;gap:9px}
  .opt{font-size:18px;min-height:62px;padding:13px}
  .opt .letter{flex:0 0 36px;height:36px;font-size:17px}
  .opt.pick{min-height:66px}
  .opt.pick .letter{flex:0 0 50px;width:50px;height:50px;font-size:24px}
  .verdict{font-size:16.5px;padding:11px 12px}

  /* map, cabin, awards */
  .island{padding:11px;min-height:96px}
  .island h3{font-size:17.5px}
  .island p{font-size:13.5px}
  .shop-grid{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .badges{grid-template-columns:repeat(auto-fill,minmax(102px,1fr))}

  /* tables stay readable and scroll sideways instead of squashing */
  table{font-size:14.5px}
  th,td{padding:6px 7px}
  .qlist{max-height:52vh}
  .qlist table{font-size:13px;min-width:620px}

  /* certificate and modal */
  .cert{padding:18px 14px;border-width:7px}
  .cert h2{font-size:24px}
  .cert .name{font-size:23px;padding:0 12px 4px}
  .modal{padding:16px}
  .modal input{font-size:22px;letter-spacing:6px}

  /* intro */
  .intro{min-height:clamp(340px,64vh,520px);padding:24px 16px}
  .intro-eyebrow{font-size:13.5px;letter-spacing:2px;margin-bottom:16px}
  .intro-role{font-size:15px;margin-bottom:18px}
  .intro-skip{right:10px;bottom:10px}
}

@media (max-width:380px){
  .qtext{font-size:18px}
  .opt{font-size:17px;padding:12px}
  .stat{font-size:15px;padding:5px 8px}
  .island h3{font-size:16.5px}
  .btn{padding:11px 13px}
}

/* phone held sideways: keep the scene from eating the screen */
@media (max-height:520px) and (orientation:landscape){
  .scene svg{height:30vh;min-height:90px}
  .intro{min-height:auto;padding:18px 16px}
  .dialogue{min-height:0;padding:10px 12px}
  .opts{grid-template-columns:1fr 1fr}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000}
  .topbar,.btn,.noprint{display:none!important}
  .cert{border-color:#000}
}

/* ============================================================
   VISUAL UPGRADE
   Fonts are embedded so the game still runs with no data.
   Pirata One (SIL OFL) — titles and place names.
   Andika (SIL OFL) — everything learners read. Andika was made
   for early readers and has plain, lining numerals, so 3, 4, 5,
   7 and 9 sit on the line like they do in a test booklet.

:root{
  --display:"Pirata One",Georgia,serif;
  --text:"Andika","Trebuchet MS","Segoe UI",Verdana,sans-serif;
  --sand:#e8cf97;
  --jungle:#5f8f5a;
  --wax:#b23a2a;
}

body{font-family:var(--text)}
button,input{font-family:var(--text)}

/* ---------- wooden top bar, pinned so coins stay in view ---------- */
.topbar{
  position:sticky;top:6px;z-index:30;
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,.0) 0 13px,rgba(0,0,0,.18) 13px 15px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 3px,transparent 3px 9px),
    linear-gradient(180deg,#936239,#6b4526);
}
.brandmark{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.5px;line-height:1;
  text-shadow:0 2px 0 var(--timber);min-width:0}
.brandmark span{font-family:var(--text);font-size:13px;letter-spacing:.3px;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:none}
.stat{gap:6px;font-size:17px}
.stat svg{width:22px;height:22px;flex:0 0 22px;display:block}
.stat.hearts{gap:2px}
.stat.hearts svg{width:21px;height:21px}
.stat.hearts svg.lost{animation:heartBreak .6s ease}
.stat.bump{animation:bump .5s ease}
.stat.hot{background:#6d2114;border-color:#3e0f07}
#btn-sound svg,#btn-map svg{width:22px;height:22px;display:block;margin:auto}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes heartBreak{0%{transform:scale(1.5) rotate(0)}50%{transform:scale(.8) rotate(-18deg)}100%{transform:none}}

/* ---------- display type ---------- */
.title-main{font-family:var(--display);font-weight:400;letter-spacing:.5px;
  font-size:clamp(40px,10vw,76px);line-height:.95;
  background:linear-gradient(180deg,#ffe08a 0%,#e0a828 55%,#b07a12 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a3a06) drop-shadow(0 8px 12px rgba(0,0,0,.55));text-shadow:none}
.title-sub{font-size:clamp(15px,3.4vw,20px);letter-spacing:.2px;margin-top:8px}
h2.head{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;letter-spacing:.3px;
  text-shadow:0 2px 0 #5a3a06}
h3.sub{font-family:var(--text);font-weight:700;font-size:19px}
.island h3{font-family:var(--text);font-weight:700}
.modal h3{font-family:var(--display);font-weight:400;font-size:28px}
.intro-name{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px)}
.qtext{font-family:var(--text);font-size:21px;line-height:1.5}
.qmeta{letter-spacing:.2px;font-size:14px}
.opt{font-family:var(--text);font-size:19px}
.opt .letter{font-family:var(--text)}

/* ---------- title screen ---------- */
.scene.hero svg{max-height:340px}
.title-wrap{padding-top:18px}
.kees-ask{display:flex;align-items:flex-end;gap:10px;max-width:420px;margin:18px auto 4px;text-align:left}
.kees-ask .portrait{flex:0 0 78px;width:78px;height:78px}
.bubble{position:relative;flex:1;background:var(--parchment);color:var(--ink);border:3px solid var(--timber);
  border-radius:14px;padding:10px 12px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:14px;border:9px solid transparent;
  border-right-color:var(--timber);border-left:0}
.bubble::after{content:"";position:absolute;left:-7px;bottom:16px;border:7px solid transparent;
  border-right-color:var(--parchment);border-left:0}
.kees-ask .field{margin:0 0 6px;color:var(--ink);font-weight:700;font-size:16px;max-width:none}
.kees-ask input[type=text]{background:#fffaf0;border-width:2px;max-width:none}
.players{margin:14px auto 0;max-width:460px}
.players p{margin:0 0 6px;font-size:14px;color:var(--parchment-dark)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;background:#0c374a;color:var(--parchment);
  border:2px solid var(--timber);border-radius:30px;padding:3px 12px 3px 3px;min-height:44px;
  font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--timber)}
.chip svg{width:36px;height:36px;border-radius:50%;background:#17566b}
.chip small{font-weight:400;color:var(--brass)}
.chip:active,.chip.pressed{transform:translateY(3px);box-shadow:none}
.chip:focus-visible{outline:3px solid var(--foam);outline-offset:3px}

/* ---------- character portraits ---------- */
.portrait{border-radius:50%;overflow:hidden;border:3px solid var(--timber);background:#17566b;
  box-shadow:0 3px 0 var(--timber)}
.portrait svg{display:block;width:100%;height:100%}
.dialogue{font-family:var(--text);font-size:18px;position:relative;z-index:2}
.dialogue .who{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.3px;
  color:#7a3a14;line-height:1.1;margin-bottom:2px}
.dialogue.has-art{display:flex;gap:14px;align-items:flex-start}
.dialogue.has-art .portrait{flex:0 0 76px;width:76px;height:76px}
.scene + .dialogue.has-art .portrait{margin-top:-44px}
.dialogue.solo{border-top:3px solid var(--timber);border-radius:10px;margin-top:0}
.talk-body{flex:1;min-width:0}
.talk-text{cursor:default}

/* ---------- animated scenery (respects reduced motion) ---------- */
.a-rock{transform-box:fill-box;transform-origin:50% 90%;animation:rock 4.6s ease-in-out infinite}
.a-wave{animation:waveDrift 5s ease-in-out infinite alternate}
.a-wave2{animation:waveDrift 6.5s ease-in-out infinite alternate-reverse}
.a-twinkle{animation:twinkle 3s ease-in-out infinite}
.a-glow{animation:glow 2.6s ease-in-out infinite}
.a-flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1.4s ease-in-out infinite}
.a-sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-2.2deg) translateY(0)}50%{transform:rotate(2.2deg) translateY(3px)}}
@keyframes waveDrift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-8deg) scaleX(.9)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

/* ---------- the treasure chart ---------- */
.map-layout{display:grid;gap:12px;align-items:start}
@media (min-width:820px){.map-layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .map-layout .map-grid{grid-template-columns:1fr}}
.chart{position:relative;width:100%;aspect-ratio:400/430;border-radius:14px;overflow:visible;
  border:3px solid var(--timber);box-shadow:0 5px 0 var(--timber);background:#e9d5a6}
.chart>svg{position:absolute;inset:0;width:100%;height:100%;border-radius:11px}
.pin{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;min-width:58px;padding:0;
  border-radius:50%;border:3px solid var(--timber);
  background:radial-gradient(circle at 35% 30%,#fff8e6,#e4cb90);
  box-shadow:0 4px 0 var(--timber),inset 0 0 0 3px var(--brass);
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;z-index:2}
.pin>svg{width:34px;height:34px}
.pin .num{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;
  background:var(--timber);color:var(--parchment);font-weight:700;font-size:14px;line-height:24px;text-align:center}
.pin .pst{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);
  background:rgba(43,26,13,.82);color:var(--brass);border-radius:8px;padding:0 5px;
  font-size:12px;line-height:17px;letter-spacing:.5px;white-space:nowrap}
.pin.done{box-shadow:0 4px 0 var(--timber),inset 0 0 0 3px var(--brass),0 0 0 3px #ffd766}
.pin.locked{background:radial-gradient(circle at 35% 30%,#b9ab8c,#8c7d61);cursor:not-allowed}
.pin.locked>svg{opacity:.35;filter:grayscale(1)}
.pin .lk{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px}
.pin.next::after{content:"";position:absolute;inset:-10px;border-radius:50%;
  border:3px solid var(--wax);animation:ping 1.8s ease-out infinite;pointer-events:none}
.pin.boss{width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#5a2a1c,#2b120a);
  box-shadow:0 4px 0 #1a0a04,inset 0 0 0 3px var(--coral)}
.pin.boss.locked{background:radial-gradient(circle at 35% 30%,#6c5c4c,#3d3228)}
.pin.boss>svg{width:44px;height:44px}
.pin:active,.pin.pressed{transform:translate(-50%,-46%);box-shadow:0 1px 0 var(--timber),inset 0 0 0 3px var(--brass)}
.pin:focus-visible{outline:3px solid var(--foam);outline-offset:4px}
@keyframes ping{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.me{position:absolute;width:48px;height:52px;transform:translate(-100%,-96%);pointer-events:none;z-index:3;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.45));animation:bob 2.2s ease-in-out infinite}
.me svg{width:100%;height:100%}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}

.map-grid{gap:8px}
.island{align-items:center;min-height:72px;padding:9px 10px}
.island-icon{position:relative;width:46px;height:46px;flex:0 0 46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8e6,#e4cb90);border:2px solid var(--timber);display:grid;place-items:center}
.island-icon svg{width:30px;height:30px}
.island-icon .num{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--timber);color:var(--parchment);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.island.next{border-color:var(--wax);box-shadow:0 4px 0 #6d2114}
.island .go{margin-left:auto;align-self:center;font-weight:700;color:var(--brass);font-size:22px;padding-left:6px}
.stars{letter-spacing:1px}
.treasure-meter{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.treasure-meter .bar{flex:1;height:18px;border-radius:9px;margin:0}
.treasure-meter .bar i{background:linear-gradient(90deg,#b07a12,#ffd766);border-radius:7px}
.treasure-meter svg{width:34px;height:34px;flex:0 0 34px}
.treasure-meter b{color:var(--brass)}

/* ---------- question card ---------- */
.qcard{background:
  radial-gradient(ellipse at 50% 0%,#fbf1d8 0%,var(--parchment) 70%,#e3cd9c 100%);
  position:relative}
.voyage{position:relative;height:34px;margin:-2px 0 8px}
.voyage::before{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:3px dashed #b39461}
.voyage .dots{position:relative;display:flex;justify-content:space-between;align-items:center;height:100%}
.voyage .dot{width:14px;height:14px;border-radius:50%;background:#fffaf0;border:2px solid #8a6a3f;flex:0 0 auto;
  transition:transform .25s ease}
.voyage .dot.first{background:var(--foam);border-color:#1c6558}
.voyage .dot.second{background:var(--brass);border-color:#6d4c08}
.voyage .dot.miss{background:var(--coral);border-color:#6d2114}
.voyage .dot.now{width:32px;height:32px;border:none;background:none;display:grid;place-items:center}
.voyage .dot.now svg{width:32px;height:32px;animation:rockSmall 2.4s ease-in-out infinite}
.voyage .dot.end svg{width:22px;height:22px;display:block}
.voyage .dot.end{border:none;background:none;width:22px;height:22px}
@keyframes rockSmall{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.qcard.shake{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.opt.right{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.verdict{display:flex;gap:12px;align-items:flex-start;animation:slideIn .28s ease}
.verdict .portrait{flex:0 0 58px;width:58px;height:58px;box-shadow:none;border-width:2px}
.verdict .vbody{flex:1;min-width:0}
.verdict .vhead svg{width:18px;height:18px;vertical-align:-3px}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* coins flying to the counter, banners, rain */
.flycoin{position:fixed;width:26px;height:26px;z-index:60;pointer-events:none;left:0;top:0}
.flycoin svg{width:100%;height:100%;display:block}
.banner{position:fixed;left:50%;top:38%;z-index:70;pointer-events:none;
  transform:translate(-50%,-50%);text-align:center;animation:banner 1.5s ease forwards}
.banner div{font-family:var(--display);font-size:clamp(40px,11vw,72px);line-height:1;color:#ffd766;
  -webkit-text-stroke:2px #5a1a08;paint-order:stroke fill;
  filter:drop-shadow(0 4px 0 #5a1a08) drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.banner svg{width:64px;height:64px}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.rain{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.rain span{position:absolute;top:-40px;width:28px;height:28px;animation:fall linear forwards}
.rain span svg{width:100%;height:100%}
@keyframes fall{to{transform:translateY(calc(100vh + 80px)) rotate(540deg)}}

/* ---------- chapter result ---------- */
.reward{text-align:center;padding:4px 0 2px}
.reward .chest{width:150px;margin:0 auto -6px}
.reward .chest svg{width:100%;height:auto;display:block}
.reward .chest.shut{filter:grayscale(.3) brightness(.85)}
.bigstars{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.bigstars svg{width:56px;height:56px;opacity:0;animation:stamp .5s cubic-bezier(.2,1.6,.5,1) forwards}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-30deg)}to{opacity:1;transform:none}}
.reward .line{font-size:18px;margin:6px 0 2px}
.reward .gain{display:inline-flex;align-items:center;gap:6px;font-size:26px;font-weight:700;color:var(--brass);margin:4px 0}
.reward .gain svg{width:30px;height:30px}
.reward .qbar{justify-content:center}

/* ---------- duel arena ---------- */
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;
  background:
    radial-gradient(ellipse at 50% 120%,rgba(224,168,40,.35),transparent 60%),
    linear-gradient(180deg,#1b0f1a,#3a1a14);
  border:3px solid var(--timber);border-radius:10px;padding:12px 12px 10px;
  box-shadow:0 5px 0 var(--timber);margin-bottom:10px}
.fighter{text-align:center;min-width:0}
.f-art{width:92px;height:92px;margin:0 auto 6px;border-radius:50%;border:3px solid var(--timber);
  overflow:hidden;background:#17566b}
.fighter.foe .f-art{background:#5a1a12}
.f-art svg{width:100%;height:100%;display:block}
.fighter span{display:block;font-size:14px;font-weight:700;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--parchment)}
.fighter .hp{height:18px;margin-top:3px}
.fighter.hit .f-art{animation:hit .45s ease}
@keyframes hit{0%{transform:none;filter:none}20%{transform:translateX(-7px) rotate(-6deg);filter:brightness(2) saturate(0)}
  50%{transform:translateX(6px) rotate(4deg);filter:sepia(1) saturate(6) hue-rotate(-30deg)}100%{transform:none;filter:none}}
.hp i.low{background:#e8812d!important;animation:glow 1s ease-in-out infinite}
.vs{align-self:center;width:52px}
.vs svg{width:52px;height:52px;display:block}
.taunt{position:relative;background:var(--parchment);color:var(--ink);border:3px solid var(--timber);
  border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:17px;font-style:italic;text-align:center}
.taunt::before{content:"";position:absolute;right:22%;top:-12px;border:9px solid transparent;
  border-bottom-color:var(--timber);border-top:0}

/* ---------- cabin ---------- */
.cabin-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cabin-top .stagebox{width:150px;height:162px;border-radius:12px;border:3px solid var(--timber);
  background:radial-gradient(ellipse at 50% 100%,#8a5c34 0 32%,transparent 33%),linear-gradient(180deg,#17566b,#0c374a)}
.cabin-top .stagebox svg{width:100%;height:100%;display:block}
.swatches{display:flex;gap:8px;margin-top:8px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--timber);padding:0}
.swatch[aria-pressed="true"]{outline:3px solid var(--brass);outline-offset:2px}
.shop-item{background:linear-gradient(180deg,#12455c,#0c374a);display:flex;flex-direction:column;align-items:center;gap:4px}
.shop-item svg{width:84px;height:90px}
.shop-item .need{width:100%;font-size:12px;color:#a9c9d4}
.shop-item .need .bar{height:10px;margin:3px 0 0}
.shop-item button svg{width:18px;height:18px;vertical-align:-4px}
.badge.got{background:radial-gradient(circle at 50% 30%,#1d6280,#12455c);animation:none}
.badge.got .bi{filter:drop-shadow(0 0 6px rgba(255,215,102,.7))}

/* ---------- certificate ---------- */
.cert{position:relative;background:
  radial-gradient(ellipse at 50% 40%,#fbf2dc 0%,#efdfbb 65%,#d8bf8a 100%)}
.cert h2{font-family:var(--display);font-weight:400;font-size:44px;line-height:1}
.cert .name{font-family:var(--display);font-size:42px}
.cert .seal{position:absolute;right:14px;bottom:14px;width:92px;height:92px}
.cert .cstars svg{width:22px;height:22px}

@media (max-width:560px){
  .brandmark{flex:1 1 100%;font-size:22px}
  body.in-q .brandmark{display:none}
  .topbar{top:4px}
  .qtext{font-size:clamp(19px,5vw,22px)}
  .dialogue{font-size:17px}
  .dialogue.has-art .portrait{flex-basis:60px;width:60px;height:60px}
  .scene + .dialogue.has-art .portrait{margin-top:-34px}
  .dialogue .who{font-size:20px}
  h2.head{font-size:29px}
  .f-art{width:70px;height:70px}
  .vs,.vs svg{width:38px;height:38px}
  .pin{width:50px;height:50px;min-width:50px}
  .pin>svg{width:30px;height:30px}
  .pin.boss{width:58px;height:58px}
  .me{width:40px;height:44px}
  .cert h2{font-size:34px}
  .cert .name{font-size:34px}
  .cert .seal{width:64px;height:64px;right:8px;bottom:8px}
  .kees-ask .portrait{flex-basis:64px;width:64px;height:64px}
  .reward .chest{width:120px}
  .bigstars svg{width:48px;height:48px}
}
@media (max-height:520px) and (orientation:landscape){
  .map-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .scene.hero svg{height:34vh}
}
@media (prefers-reduced-motion:reduce){.flycoin,.rain,.banner{display:none!important}}
@media print{.cert .seal{filter:grayscale(1)}}
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.ico svg{width:100%;height:100%;display:block}

/* sticky needs a page that is not its own scroll box */
html,body{overflow-x:hidden;overflow-x:clip}
.toast{bottom:auto;top:calc(84px + env(safe-area-inset-top));pointer-events:none;
  font-size:16px;border-radius:12px;animation:slideIn .3s ease}
@media (max-width:560px){
  .topbar{gap:5px;padding:6px 7px}
  .stat{padding:5px 7px;min-height:44px;font-size:16px;gap:4px}
  .stat svg{width:20px;height:20px;flex-basis:20px}
  .stat.hearts{gap:1px}
  .stat.hearts svg{width:17px;height:17px}
  .topbar .btn.small{padding:6px 8px;min-width:44px}
  .island p{font-size:13px}
}
@media (max-width:360px){
  .stat.hearts svg{width:15px;height:15px}
  .topbar .btn.small{min-width:40px;padding:6px 6px}
}

/* older iOS (iPadOS 14 and before) has no aspect-ratio: keep the map's shape
   with the padding trick, and size SVGs explicitly — WebKit will not guess */
@supports not (aspect-ratio: 1 / 1){
  .chart{height:0;padding-top:107.5%}
}
.pin .lk>svg,.cert .seal>svg,.pin .num>svg{width:100%;height:100%;display:block}
.stat>svg,.voyage .dot>svg,.chip>svg{flex:0 0 auto}

</style>
</head>
<body>
<div class="stage">

  <!-- ===================== TOP BAR ===================== -->
  <div class="topbar" id="topbar" style="display:none">
    <div class="brandmark">Baviaaneiland<span id="tb-player">—</span></div>
    <div class="stat" id="tb-coins" role="img"></div>
    <div class="stat hearts" id="tb-lives" role="img"></div>
    <div class="stat" id="tb-streak" role="img" aria-label="streak"></div>
    <button class="btn small quiet" id="btn-lang" onclick="toggleLang()">EN</button>
    <button class="btn small quiet" id="btn-sound" onclick="toggleSound()" aria-label="Sound / Klank"></button>
    <button class="btn small quiet" id="btn-map" onclick="goMap()" aria-label="Map / Kaart"></button>
  </div>

  <!-- ===================== INTRO ===================== -->
  <div class="screen on" id="scr-intro">
    <div class="intro" id="intro-box">
      <div class="intro-grid" aria-hidden="true"></div>
      <div id="intro-syms" aria-hidden="true"></div>
      <div class="intro-inner" id="intro-inner" role="region" aria-label="Credits"></div>
      <div class="intro-dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>
      <button class="btn quiet small intro-skip" id="btn-skip" onclick="skipIntro()">Skip intro · ESC</button>
    </div>
  </div>

  <!-- ===================== TITLE ===================== -->
  <div class="screen" id="scr-title">
    <div class="scene hero" id="title-scene" aria-hidden="true"></div>
    <div class="panel title-wrap">
      <h1 class="title-main" id="t-main">Die Geheim van Baviaaneiland</h1>
      <p class="title-sub" id="t-sub">'n Wiskunde-avontuur vir Graad 6</p>
      <div class="kees-ask">
        <div class="portrait" id="t-kees" aria-hidden="true"></div>
        <div class="bubble">
          <label class="field" for="nameIn" id="t-namelabel">Wat is jou seerowersnaam?</label>
          <input type="text" id="nameIn" maxlength="18" placeholder="…" autocomplete="off">
        </div>
      </div>
      <div class="players" id="t-players"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="startGame()" id="t-start">Begin die avontuur</button>
        <button class="btn quiet" onclick="toggleLang()" id="t-lang">English</button>
      </div>
      <p class="note" style="margin-top:14px" id="t-foot">75 vrae · CAPS Graad 6 · Afrikaans &amp; English</p>
    </div>
  </div>

  <!-- ===================== MAP ===================== -->
  <div class="screen" id="scr-map">
    <div class="dialogue solo" id="map-talk"></div>
    <div class="map-layout">
    <div class="chart" id="chart"></div>
    <div class="panel">
      <h2 class="head" id="m-head">Die kaart</h2>
      <div id="map-progress"></div>
      <div class="map-grid" id="map-grid"></div>
      <div class="qbar" style="margin-top:14px">
        <button class="btn quiet small" onclick="showCabin()" id="m-cabin">Jou kajuit</button>
        <button class="btn quiet small" onclick="showTeacher()" id="m-teacher">Vir die Opvoeder 🔒</button>
        <button class="btn quiet small" onclick="showCert()" id="m-cert">Sertifikaat</button>
        <button class="btn quiet small" onclick="showSettings()" id="m-set">Instellings</button>
      </div>
    </div>
    </div>
  </div>

  <!-- ===================== CHAPTER ===================== -->
  <div class="screen" id="scr-chapter">
    <div class="scene" id="ch-scene" aria-hidden="true"></div>
    <div class="dialogue" id="ch-talk"></div>
    <div class="panel" id="ch-panel"></div>
  </div>

  <!-- ===================== QUESTION ===================== -->
  <div class="screen" id="scr-q">
    <div id="duel-ui" style="display:none">
      <div class="arena">
        <div class="fighter" id="f-you"><div class="f-art" id="f-you-art"></div><span id="hp-you-lbl">Jy</span><div class="hp"><i id="hp-you" style="width:100%"></i></div></div>
        <div class="vs" id="f-vs" aria-hidden="true"></div>
        <div class="fighter foe" id="f-foe"><div class="f-art" id="f-foe-art"></div><span id="hp-foe-lbl">Kaptein Skurwebaard</span><div class="hp foe"><i id="hp-foe" style="width:100%"></i></div></div>
      </div>
      <div class="taunt" id="duel-taunt"></div>
    </div>
    <div class="qcard">
      <div class="voyage" id="q-voyage"></div>
      <div class="qmeta" id="q-meta"></div>
      <p class="qtext" id="q-text" aria-live="polite"></p>
      <div class="qfig" id="q-fig"></div>
      <div class="opts" id="q-opts" role="group" aria-label="Answer options"></div>
      <div id="q-verdict" role="status" aria-live="polite"></div>
      <div class="qbar">
        <button class="btn quiet small" id="q-hint" onclick="askHint()">Wenk</button>
        <button class="btn quiet small" id="q-show" onclick="showMethod()">Wys my hoe</button>
        <span class="spacer"></span>
        <button class="btn" id="q-next" onclick="nextQuestion()" style="display:none">Volgende</button>
      </div>
    </div>
  </div>

  <!-- ===================== GENERIC PANEL SCREEN ===================== -->
  <div class="screen" id="scr-info"><div class="panel" id="info-body"></div></div>

</div>
<div id="modal-host"></div>
<script>
/* ============================================================
   SECTION: SVG ASSETS
   Every figure is drawn inline. Nothing is loaded from the web.
   ============================================================ */
const INK = "#2b1a0d", PLANK = "#6b4526", BRASS = "#a87a16", SHADE = "#9db9c4", SEA = "#17566b";

function svg(w, h, body, extra) {
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" ${extra || ""}
    xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto">${body}</svg>`;
}

/* square grid; shaded = array of "row,col" (0-based) */
function gGrid(cols, rows, shaded, cell) {
  cell = cell || 26; shaded = shaded || [];
  let b = "";
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const on = shaded.indexOf(r + "," + c) > -1;
    b += `<rect x="${c * cell + 2}" y="${r * cell + 2}" width="${cell}" height="${cell}"
      fill="${on ? SHADE : "#fffdf7"}" stroke="${INK}" stroke-width="1.5"/>`;
  }
  return svg(cols * cell + 4, rows * cell + 4, b);
}

/* flow diagram: boxes = array of rule labels */
function gFlow(inputs, rules, outputs) {
  const rowH = 34, n = Math.max(inputs.length, outputs.length), h = n * rowH + 30;
  const midY = h / 2, bw = 74, bh = 44;
  let b = "";
  const boxes = rules.length;
  const bx = i => 110 + i * 118;
  inputs.forEach((v, i) => {
    const y = 15 + i * rowH;
    b += `<rect x="6" y="${y}" width="76" height="26" fill="#fffdf7" stroke="${INK}" stroke-width="2" rx="3"/>
          <text x="44" y="${y + 18}" font-size="16" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif">${v}</text>
          <line x1="82" y1="${y + 13}" x2="${bx(0)}" y2="${midY}" stroke="${INK}" stroke-width="1.5"/>`;
  });
  rules.forEach((r, i) => {
    b += `<rect x="${bx(i)}" y="${midY - bh / 2}" width="${bw}" height="${bh}" fill="${BRASS}" stroke="${INK}" stroke-width="2" rx="4"/>
          <text x="${bx(i) + bw / 2}" y="${midY + 6}" font-size="17" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif" font-weight="bold">${r}</text>`;
    if (i < rules.length - 1) b += `<line x1="${bx(i) + bw}" y1="${midY}" x2="${bx(i + 1)}" y2="${midY}" stroke="${INK}" stroke-width="2"/>`;
  });
  const endX = bx(boxes - 1) + bw;
  outputs.forEach((v, i) => {
    const y = 15 + i * rowH;
    b += `<line x1="${endX}" y1="${midY}" x2="${endX + 28}" y2="${y + 13}" stroke="${INK}" stroke-width="1.5"/>
          <rect x="${endX + 28}" y="${y}" width="76" height="26" fill="#fffdf7" stroke="${INK}" stroke-width="2" rx="3"/>
          <text x="${endX + 66}" y="${y + 18}" font-size="16" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif">${v}</text>`;
  });
  return svg(endX + 110, h, b);
}

/* grouped bar graph: cats = [{l, a, b}]  a = solid (girls), b = hatched (boys) */
function gBar(cats, max, step, yTitle, legA, legB) {
  const W = 420, H = 256, x0 = 78, y0 = 198, top = 36, bw = 22, gap = 8, grp = 26;
  let b = `<defs><pattern id="hh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fffdf7"/><line x1="0" y1="0" x2="0" y2="6" stroke="${INK}" stroke-width="2.2"/></pattern></defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="#fffdf7"/>`;
  const sc = v => (v / max) * (y0 - top);
  for (let v = 0; v <= max; v += step) {
    const y = y0 - sc(v);
    b += `<line x1="${x0}" y1="${y}" x2="${W - 12}" y2="${y}" stroke="#cfc8b8" stroke-width="1"/>
      <text x="${x0 - 6}" y="${y + 4}" font-size="12" text-anchor="end" fill="${INK}" font-family="Verdana,sans-serif">${String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ")}</text>`;
  }
  b += `<line x1="${x0}" y1="${top - 6}" x2="${x0}" y2="${y0}" stroke="${INK}" stroke-width="2"/>
    <line x1="${x0}" y1="${y0}" x2="${W - 12}" y2="${y0}" stroke="${INK}" stroke-width="2"/>
    <text x="16" y="${(top + y0) / 2}" font-size="13" fill="${INK}" font-family="Verdana,sans-serif"
      transform="rotate(-90 16 ${(top + y0) / 2})" text-anchor="middle">${yTitle || ""}</text>`;
  cats.forEach((c, i) => {
    const gx = x0 + 14 + i * (bw * 2 + gap + grp);
    b += `<rect x="${gx}" y="${y0 - sc(c.a)}" width="${bw}" height="${sc(c.a)}" fill="${INK}" stroke="${INK}" stroke-width="1.5"/>
      <rect x="${gx + bw + gap}" y="${y0 - sc(c.b)}" width="${bw}" height="${sc(c.b)}" fill="url(#hh)" stroke="${INK}" stroke-width="1.5"/>
      <text x="${gx + bw + gap / 2}" y="${y0 + 16}" font-size="13" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif">${c.l}</text>`;
  });
  b += `<rect x="${W - 92}" y="6" width="12" height="12" fill="${INK}"/>
    <text x="${W - 76}" y="16" font-size="13" fill="${INK}" font-family="Verdana,sans-serif">${legA}</text>
    <rect x="${W - 92}" y="22" width="12" height="12" fill="url(#hh)" stroke="${INK}" stroke-width="1.5"/>
    <text x="${W - 76}" y="32" font-size="13" fill="${INK}" font-family="Verdana,sans-serif">${legB}</text>`;
  return svg(W, H, b);
}

/* pie chart from values */
function gPie(values, labels, size) {
  size = size || 150; const r = size / 2 - 4, cx = size / 2, cy = size / 2;
  const tot = values.reduce((a, b) => a + b, 0);
  let ang = -Math.PI / 2, b = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffdf7" stroke="${INK}" stroke-width="2"/>`;
  values.forEach((v, i) => {
    const sweep = (v / tot) * Math.PI * 2, mid = ang + sweep / 2;
    b += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(ang)}" y2="${cy + r * Math.sin(ang)}" stroke="${INK}" stroke-width="2"/>`;
    if (labels && labels[i]) {
      const lx = cx + r * 0.62 * Math.cos(mid), ly = cy + r * 0.62 * Math.sin(mid);
      labels[i].split("|").forEach((ln, k) =>
        b += `<text x="${lx}" y="${ly + k * 12 - 3}" font-size="11" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif">${ln}</text>`);
    }
    ang += sweep;
  });
  return svg(size, size, b);
}

/* row of beads: string of b/w */
function gBeads(pat) {
  let b = "", x = 16;
  for (const ch of pat) { b += `<circle cx="${x}" cy="18" r="13" fill="${ch === "b" ? INK : "#fffdf7"}" stroke="${INK}" stroke-width="2"/>`; x += 28; }
  return svg(x, 40, b);
}

/* circles, some shaded */
function gCircles(total, shadedIdx, perRow) {
  perRow = perRow || 5; let b = "";
  for (let i = 0; i < total; i++) {
    const r = Math.floor(i / perRow), c = i % perRow;
    b += `<circle cx="${c * 46 + 26}" cy="${r * 46 + 26}" r="19"
      fill="${shadedIdx.indexOf(i) > -1 ? SHADE : "#fffdf7"}" stroke="${INK}" stroke-width="2"/>`;
  }
  return svg(perRow * 46 + 6, Math.ceil(total / perRow) * 46 + 6, b);
}

/* rectangular prism with labels */

}

/* measuring jug */
function gJug(fillFrac, topLabel) {
  const jx = 34, jy = 20, jw = 92, jh = 132, fh = jh * fillFrac;
  let b = `<path d="M${jx} ${jy} L${jx} ${jy + jh} Q${jx} ${jy + jh + 12} ${jx + 14} ${jy + jh + 12}
      L${jx + jw - 14} ${jy + jh + 12} Q${jx + jw} ${jy + jh + 12} ${jx + jw} ${jy + jh} L${jx + jw} ${jy}"
      fill="#fffdf7" stroke="${INK}" stroke-width="2.5"/>
    <rect x="${jx + 2}" y="${jy + jh - fh}" width="${jw - 4}" height="${fh + 10}" fill="${SHADE}" opacity=".85"/>
    <path d="M${jx + jw} ${jy + 22} q26 34 0 68" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
  for (let i = 1; i <= 4; i++) {

    b += `<line x1="${jx}" y1="${y}" x2="${jx + (i === 4 ? 36 : 20)}" y2="${y}" stroke="${INK}" stroke-width="2.5"/>`;
  }
  b += `<text x="${jx + 44}" y="${jy + 6}" font-size="16" fill="${INK}" font-family="Verdana,sans-serif">${topLabel}</text>`;
  return svg(200, 186, b);
}

function gShapes2D() {

/* four candidate nets, labelled A-D */
function gNets() {
  const sets = [
    { k:"A", ox:16,  cells:[[0,0],[1,0],[2,0],[3,0],[4,0]] },              // straight strip of 5
    { k:"B", ox:70,  cells:[[0,0],[0,1],[0,2],[0,3],[1,1]] },              // 4 walls + base  (valid)
    { k:"C", ox:190, cells:[[0,0],[0,1],[1,0],[1,1],[2,0]] },              // 2x2 block + 1
    { k:"D", ox:260, cells:[[0,0],[1,0],[1,1],[2,1],[2,2]] }               // staircase
  ];
  const s2 = 22; let b = `<rect x="0" y="0" width="360" height="150" fill="#fffdf7"/>`;
  sets.forEach(n => {
    n.cells.forEach(p => {
      b += `<rect x="${n.ox + p[1] * s2}" y="${16 + p[0] * s2}" width="${s2}" height="${s2}" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
    });
    const wdt = (Math.max.apply(null, n.cells.map(p => p[1])) + 1) * s2;
    b += `<text x="${n.ox + wdt / 2}" y="142" font-size="16" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif" font-weight="bold">${n.k}</text>`;
  });
  return svg(360, 150, b);
}

/* reflection: a flag shape and four candidate results */
function gReflect() {
  const FLAG = `<g stroke="${INK}" stroke-width="3" fill="${INK}" stroke-linejoin="round">
      <line x1="12" y1="8" x2="12" y2="44"/><polygon points="12,9 28,14 12,19"/></g>`;
  const BW = 78, BH = 50;
  const box = (ox, oy, lbl, tf) =>
    `<rect x="${ox}" y="${oy}" width="${BW}" height="${BH}" fill="#fffdf7" stroke="${INK}" stroke-width="2"/>
     <line x1="${ox + BW / 2}" y1="${oy}" x2="${ox + BW / 2}" y2="${oy + BH}" stroke="${INK}" stroke-width="2" stroke-dasharray="5 4"/>
     <g transform="translate(${ox},${oy}) ${tf}">${FLAG}</g>` +
    (lbl ? `<text x="${ox + BW / 2}" y="${oy + BH + 18}" font-size="16" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif" font-weight="bold">${lbl}</text>` : "");
  let b = `<rect x="0" y="0" width="360" height="200" fill="#fffdf7"/>
    <text x="30" y="30" font-size="14" fill="${INK}" font-family="Verdana,sans-serif">${""}</text>`;
  b += box(141, 8, "", "");                                        // original
  b += box(8,   106, "A", `translate(40,0)`);                      // slid across, not flipped
  b += box(98,  106, "B", `translate(${BW},0) scale(-1,1)`);       // true reflection
  b += box(188, 106, "C", `translate(0,${BH}) scale(1,-1)`);       // flipped top to bottom
  b += box(278, 106, "D", `translate(${BW},${BH}) scale(-1,-1)`);  // turned right around
  return svg(360, 200, b);
}

/* three cubes standing on the floor, plus candidate plan views (A-D) */
function gStackTop() {
  const cube = (x, y) => `<polygon points="${x},${y} ${x + 22},${y - 11} ${x + 44},${y} ${x + 22},${y + 11}" fill="#fff" stroke="${INK}" stroke-width="1.6"/>
    <polygon points="${x},${y} ${x},${y + 24} ${x + 22},${y + 35} ${x + 22},${y + 11}" fill="#e6e0d2" stroke="${INK}" stroke-width="1.6"/>
    <polygon points="${x + 22},${y + 11} ${x + 22},${y + 35} ${x + 44},${y + 24} ${x + 44},${y}" fill="${SHADE}" stroke="${INK}" stroke-width="1.6"/>`;
  let b = `<rect x="0" y="0" width="360" height="176" fill="#fffdf7"/>`;
  b += cube(56, 52) + cube(34, 63) + cube(78, 63);   // back cube, then the two in front: an L on the floor
  const grid = (ox, oy, on, lbl) => {
    let g = "";
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++)
      g += `<rect x="${ox + c * 22}" y="${oy + r * 22}" width="22" height="22"
        fill="${on.indexOf(r + "," + c) > -1 ? SHADE : "#fff"}" stroke="${INK}" stroke-width="1.6"/>`;
    g += `<text x="${ox + 22}" y="${oy + 62}" font-size="16" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif" font-weight="bold">${lbl}</text>`;
    return g;
  };
  b += grid(196, 22, ["0,0", "0,1", "1,0", "1,1"], "A");
  b += grid(280, 22, ["0,0", "1,0"], "B");
  b += grid(196, 100, ["0,0", "1,0", "1,1"], "C");
  b += grid(280, 100, ["0,1", "1,0"], "D");
  return svg(360, 176, b);
}

/* growing triangle pattern 1, 4, 9 */
function gTriPattern() {
  const tri = (x, y, s, fill) => `<polygon points="${x},${y + s} ${x + s / 2},${y} ${x + s},${y + s}" fill="${fill}" stroke="${INK}" stroke-width="1.2"/>`;
  let b = `<rect x="0" y="0" width="340" height="120" fill="#fffdf7"/>`;
  [1, 2, 3].forEach((n, i) => {
    const ox = 60 + i * 110, s = 22, oy = 84 - n * s;
    let g = "";
    for (let r = 0; r < n; r++) {
      const y = oy + r * s;
      for (let c = 0; c <= r; c++) g += tri(ox - r * s / 2 + c * s, y, s, INK);
      for (let c = 0; c < r; c++) g += tri(ox - r * s / 2 + c * s + s / 2, y, s, "#fff");
    }
    b += g + `<text x="${ox}" y="110" font-size="14" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif">${i + 1}</text>`;
  });
  return svg(340, 120, b);
}

/* matchstick strip: n triangles sharing sides, uses 2n + 1 matches */
function gMatch(n) {
  const w = 44, h = 40, ox = 16, oy = 58;
  let b = `<rect x="0" y="0" width="${ox * 2 + n * w / 2 + w / 2}" height="86" fill="#fffdf7"/>`;
  const stick = (x1, y1, x2, y2) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${BRASS}" stroke-width="5" stroke-linecap="round"/>`;
  for (let i = 0; i < n; i++) {
    const x = ox + i * w / 2;
    if (i % 2 === 0) { b += stick(x, oy, x + w, oy); b += stick(x, oy, x + w / 2, oy - h); }
    else { b += stick(x, oy - h, x + w, oy - h); b += stick(x, oy - h, x + w / 2, oy); }
  }
  // closing stick on the right
  const lx = ox + (n - 1) * w / 2;
  b += (n % 2 === 1) ? stick(lx + w / 2, oy - h, lx + w, oy) : stick(lx + w / 2, oy, lx + w, oy - h);
  let g = "";
  for (let i = 0; i < n; i++) g += `<text x="${ox + i * w / 2 + w / 2}" y="78" font-size="13" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif">${i + 1}</text>`;
  return svg(ox * 2 + n * w / 2 + w / 2, 86, b + g);
}

/* squares pattern: 1, 3, 6 */
function gSquarePattern() {
  const s = 20; let b = `<rect x="0" y="0" width="330" height="110" fill="#fffdf7"/>`;
  const shapes = [[[0, 0]], [[0, 0], [1, 0], [1, 1]], [[0, 0], [1, 0], [1, 1], [2, 0], [2, 1], [2, 2]]];
  shapes.forEach((cells, i) => {
    const ox = 30 + i * 105;
    cells.forEach(p => b += `<rect x="${ox + p[1] * s}" y="${20 + p[0] * s}" width="${s}" height="${s}" fill="#fff" stroke="${INK}" stroke-width="2"/>`);
    b += `<text x="${ox + 22}" y="100" font-size="14" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif">${i + 1}</text>`;
  });
  return svg(330, 110, b);
}

/* rectangle with candidate symmetry lines */
function gSymmetry() {
  const rect = (ox, lines, lbl) => {
    let g = `<rect x="${ox}" y="18" width="72" height="48" fill="#fffdf7" stroke="${INK}" stroke-width="2.5"/>`;
    if (lines.indexOf("h") > -1) g += `<line x1="${ox}" y1="42" x2="${ox + 72}" y2="42" stroke="${INK}" stroke-width="1.6"/>`;
    if (lines.indexOf("v") > -1) g += `<line x1="${ox + 36}" y1="18" x2="${ox + 36}" y2="66" stroke="${INK}" stroke-width="1.6"/>`;
    if (lines.indexOf("d") > -1) g += `<line x1="${ox}" y1="18" x2="${ox + 72}" y2="66" stroke="${INK}" stroke-width="1.6"/>`;
    if (lines.indexOf("e") > -1) g += `<line x1="${ox}" y1="66" x2="${ox + 72}" y2="18" stroke="${INK}" stroke-width="1.6"/>`;
    g += `<text x="${ox + 36}" y="84" font-size="15" text-anchor="middle" fill="${INK}" font-family="Verdana,sans-serif" font-weight="bold">${lbl}</text>`;
    return g;
  };
  let b = `<rect x="0" y="0" width="360" height="96" fill="#fffdf7"/>`;
  b += rect(10, ["d", "e"], "A") + rect(100, ["h", "v"], "B") + rect(190, ["v", "d"], "C") + rect(280, ["e"], "D");
  return svg(360, 96, b);
}

}

/* unit cubes filling a box */

 o:["1; 5; 15","1; 3; 5; 15","3; 5","15; 30; 45"],oAf:["1; 5; 15","1; 3; 5; 15","3; 5","15; 30; 45"],ci:1,
 hi:"A factor divides into 15 without a remainder.",hiAf:"'n Faktor deel in 15 sonder 'n res.",
 ex:"1 × 15 = 15 and 3 × 5 = 15, so the factors are 1; 3; 5 and 15.",
 exAf:"1 × 15 = 15 en 3 × 5 = 15, dus is die faktore 1; 3; 5 en 15."},

{a:"NUM",ch:1,q:"The figure represents one whole. What decimal fraction is shaded?",
 qAf:"Die figuur stel een geheel voor. Watter desimale breuk is gearseer?",
 fa:"A strip divided into ten equal parts, four of them shaded.",faAf:"'n Strook wat in tien gelyke dele verdeel is, vier daarvan gearseer.",
 fig:gGrid(10,1,["0,0","0,1","0,2","0,3"],30),
 o:["0,04","4,0","0,4","0,14"],oAf:["0,04","4,0","0,4","0,14"],ci:2,
 hi:"There are 10 equal parts and 4 are shaded.",hiAf:"Daar is 10 gelyke dele en 4 is gearseer.",
 ex:"4 out of 10 = 4/10 = 0,4.",exAf:"4 uit 10 = 4/10 = 0,4."},

{a:"NUM",ch:2,q:"The grid represents one whole. What percentage is shaded?",
 qAf:"Die rooster stel een geheel voor. Watter persentasie is gearseer?",
 fa:"A hundred-block grid with one full column and half of the next column shaded, fifteen blocks in all.",faAf:"'n Rooster van honderd blokkies met een volle kolom en die helfte van die volgende kolom gearseer, vyftien blokkies altesaam.",
 fig:gGrid(10,10,(function(){const s=[];for(let r=0;r<10;r++){s.push(r+",0");if(r<5)s.push(r+",1");}return s;})(),16),
 o:["1,5%","10%","20%","15%"],oAf:["1,5%","10%","20%","15%"],ci:3,
 hi:"The whole grid has 100 blocks. Count the shaded ones.",hiAf:"Die hele rooster het 100 blokkies. Tel die gearseerdes.",
 ex:"One full column (10) plus half of the next column (5) = 15 blocks out of 100 = 15%.",
 exAf:"Een volle kolom (10) plus die helfte van die volgende kolom (5) = 15 blokkies uit 100 = 15%."},

/* ---------- CHAPTER 2 · THE CHART ROOM · patterns, functions & algebra ---------- */
{a:"ALG",ch:3,q:"What number comes out of the flow diagram when 119 goes in?",
 qAf:"Watter getal kom uit die vloeidiagram wanneer 119 ingaan?",
 fa:"A flow diagram: inputs 9, 44, 110 and 119 go through a plus 1 box and then a times 5 box, giving 50, 225, 555 and an unknown output.",faAf:"'n Vloeidiagram: insette 9, 44, 110 en 119 gaan deur 'n plus 1-blok en dan 'n maal 5-blok, wat 50, 225, 555 en 'n onbekende uitset gee.",
 fig:gFlow([9,44,110,119],["+ 1","× 5"],[50,225,555,"?"]),
 o:["600","595","604","596"],oAf:["600","595","604","596"],ci:0,
 hi:"Do the two steps in order: first + 1, then × 5.",hiAf:"Doen die twee stappe in volgorde: eers + 1, dan × 5.",
 ex:"119 + 1 = 120, and 120 × 5 = 600.",exAf:"119 + 1 = 120, en 120 × 5 = 600."},

{a:"ALG",ch:3,q:"Write down the rule for this flow diagram.",qAf:"Skryf die reël vir hierdie vloeidiagram neer.",
 fa:"A flow diagram with one unknown rule: 4 gives 48, 12 gives 144, 8 gives 96 and 5 gives 60.",faAf:"'n Vloeidiagram met een onbekende reël: 4 gee 48, 12 gee 144, 8 gee 96 en 5 gee 60.",
 fig:gFlow([4,12,8,5],["?"],[48,144,96,60]),
 o:["+ 44","× 12","× 10 + 8","× 4 + 32"],oAf:["+ 44","× 12","× 10 + 8","× 4 + 32"],ci:1,
 hi:"Test your rule on every pair, not just the first one.",hiAf:"Toets jou reël op elke paar, nie net die eerste een nie.",
 ex:"4 × 12 = 48; 12 × 12 = 144; 8 × 12 = 96; 5 × 12 = 60. The rule is × 12.",
 exAf:"4 × 12 = 48; 12 × 12 = 144; 8 × 12 = 96; 5 × 12 = 60. Die reël is × 12."},

{a:"ALG",ch:3,q:"Picture 1 has 1 small triangle, picture 2 has 4 and picture 3 has 9. How many small triangles will picture 8 have?",
 qAf:"Prent 1 het 1 klein driehoek, prent 2 het 4 en prent 3 het 9. Hoeveel klein driehoeke sal prent 8 hê?",
 fa:"Three pictures of a growing triangle pattern made of 1, 4 and 9 small triangles.",faAf:"Drie prente van 'n groeiende driehoekpatroon van 1, 4 en 9 klein driehoeke.",
 fig:gTriPattern(),
 o:["16","36","64","81"],oAf:["16","36","64","81"],ci:2,
 hi:"1, 4, 9 are square numbers: 1×1, 2×2, 3×3.",hiAf:"1, 4, 9 is vierkantgetalle: 1×1, 2×2, 3×3.",
 ex:"The rule is picture number × itself. Picture 8 → 8 × 8 = 64.",
 exAf:"Die reël is prentnommer × homself. Prent 8 → 8 × 8 = 64."},

{a:"ALG",ch:3,q:"The pattern grows by adding one more triangle to the strip. Figure 1 uses 3 matches, figure 2 uses 5 and figure 3 uses 7. How many matches are in figure 6?",
 qAf:"Die patroon groei deur elke keer nog 'n driehoek by die strook te voeg. Figuur 1 gebruik 3 vuurhoutjies, figuur 2 gebruik 5 en figuur 3 gebruik 7. Hoeveel vuurhoutjies is in figuur 6?",
 fa:"A strip of three triangles that share their sides, built from seven matches.",faAf:"'n Strook van drie driehoeke wat hul sye deel, gebou uit sewe vuurhoutjies.",
 fig:gMatch(3),
 o:["15","11","18","13"],oAf:["15","11","18","13"],ci:3,
 hi:"Each new figure adds 2 matches.",hiAf:"Elke nuwe figuur voeg 2 vuurhoutjies by.",
 ex:"3, 5, 7, 9, 11, 13. The rule is (figure × 2) + 1, so 6 × 2 + 1 = 13.",
 exAf:"3, 5, 7, 9, 11, 13. Die reël is (figuur × 2) + 1, dus 6 × 2 + 1 = 13."},

{a:"ALG",ch:3,q:"How many squares will there be in the 5th figure of this pattern?",
 qAf:"Hoeveel vierkante sal daar in die 5de figuur van hierdie patroon wees?",
 fa:"Three pictures of a growing staircase pattern made of 1, 3 and 6 squares.",faAf:"Drie prente van 'n groeiende trappatroon van 1, 3 en 6 vierkante.",
 fig:gSquarePattern(),
 o:["15","12","11","13"],oAf:["15","12","11","13"],ci:0,
 hi:"The pattern goes 1, 3, 6 … you add one more each time.",hiAf:"Die patroon gaan 1, 3, 6 … jy tel elke keer een meer by.",
 ex:"1 (+2) 3 (+3) 6 (+4) 10 (+5) 15. The 5th figure has 15 squares.",
 exAf:"1 (+2) 3 (+3) 6 (+4) 10 (+5) 15. Die 5de figuur het 15 vierkante."},

{a:"ALG",ch:3,q:"The teacher writes this pattern on the board:<br>2,50;  2,55;  2,60;  ____;  ____<br>Which numbers go in the blank spaces?",
 qAf:"Die onderwyser skryf hierdie patroon op die bord:<br>2,50;  2,55;  2,60;  ____;  ____<br>Watter getalle kom in die oop spasies?",
 o:["26,5;  27,0","2,65;  2,70","2,61;  2,62","265;  270"],oAf:["26,5;  27,0","2,65;  2,70","2,61;  2,62","265;  270"],ci:1,
 hi:"How much is added each time?",hiAf:"Hoeveel word elke keer bygetel?",
 ex:"The pattern adds 0,05 each time: 2,60 + 0,05 = 2,65 and 2,65 + 0,05 = 2,70.",
 exAf:"Die patroon tel elke keer 0,05 by: 2,60 + 0,05 = 2,65 en 2,65 + 0,05 = 2,70."},

{a:"ALG",ch:3,q:"What number goes in the block to make the number sentence true?<br>3 × ▢ + 5 = 26",
 qAf:"Watter getal kom in die blokkie om die getalsin waar te maak?<br>3 × ▢ + 5 = 26",
 o:["6","9","7","8"],oAf:["6","9","7","8"],ci:2,
 hi:"Take the 5 away first, then divide by 3.",hiAf:"Trek eers die 5 af, deel dan deur 3.",
 ex:"26 − 5 = 21 and 21 ÷ 3 = 7. Check: 3 × 7 + 5 = 26.",
 exAf:"26 − 5 = 21 en 21 ÷ 3 = 7. Toets: 3 × 7 + 5 = 26."},

{a:"ALG",ch:3,q:"Input: 2, 3, 4.  Output: 5, 7, 9.  What is the rule?",
 qAf:"Inset: 2, 3, 4.  Uitset: 5, 7, 9.  Wat is die reël?",
 o:["+ 3","× 3 − 1","× 2","× 2 + 1"],oAf:["+ 3","× 3 − 1","× 2","× 2 + 1"],ci:3,
 hi:"The outputs go up by 2 while the inputs go up by 1.",hiAf:"Die uitsette styg met 2 terwyl die insette met 1 styg.",
 ex:"2 × 2 + 1 = 5;  3 × 2 + 1 = 7;  4 × 2 + 1 = 9. (+ 3 only works for the first pair.)",
 exAf:"2 × 2 + 1 = 5;  3 × 2 + 1 = 7;  4 × 2 + 1 = 9. (+ 3 werk net vir die eerste paar.)"},

/* ---------- CHAPTER 3 · THE CAVE OF SHADOWS · space & shape ---------- */
{a:"GEO",ch:4,nosh:1,q:"These figures are 2-D shapes. Which shape is a parallelogram?",
 qAf:"Hierdie figure is 2D-vorms. Watter vorm is 'n parallelogram?",
 fa:"Four shapes on a grid: 1 is a triangle, 2 is a trapezium, 3 is a parallelogram and 4 is a circle.",faAf:"Vier vorms op 'n rooster: 1 is 'n driehoek, 2 is 'n trapesium, 3 is 'n parallelogram en 4 is 'n sirkel.",
 fig:gShapes2D(),
 o:["1","2","3","4"],oAf:["1","2","3","4"],ci:2,
 hi:"A parallelogram has two pairs of opposite sides that are parallel.",hiAf:"'n Parallelogram het twee pare teenoorstaande sye wat ewewydig is.",
 ex:"Shape 3 has both pairs of opposite sides parallel and equal. Shape 2 is a trapezium — only one pair is parallel.",
 exAf:"Vorm 3 se twee pare teenoorstaande sye is ewewydig en gelyk. Vorm 2 is 'n trapesium — net een paar is ewewydig."},

{a:"GEO",ch:4,q:"What is true about <b>both</b> a tetrahedron (triangular-based pyramid) and a square-based pyramid?",
 qAf:"Wat is waar van <b>albei</b> 'n tetraëder (driehoekige piramide) en 'n vierkantige piramide?",
 fa:"A drawing of a square-based pyramid.",faAf:"'n Tekening van 'n vierkantige piramide.",
 fig:gSolid("sqpyr"),
 o:["They both have 12 edges.","Four faces of each object are triangular.","Both objects have a curved surface.","They both have 5 faces."],
 oAf:["Albei het 12 ribbe.","Vier vlakke van elke voorwerp is driehoekig.","Albei voorwerpe het 'n geboë oppervlak.","Albei het 5 vlakke."],ci:1,
 hi:"Count the triangular faces on each one.",hiAf:"Tel die driehoekige vlakke van elkeen.",
 ex:"A tetrahedron has 4 triangular faces. A square-based pyramid has 4 triangular faces plus a square base. So 'four triangular faces' is true for both. The tetrahedron has only 4 faces and 6 edges, and neither has a curved surface.",
 exAf:"'n Tetraëder het 4 driehoekige vlakke. 'n Vierkantige piramide het 4 driehoekige vlakke plus 'n vierkantige basis. Dus is 'vier driehoekige vlakke' waar vir albei. Die tetraëder het net 4 vlakke en 6 ribbe, en nie een het 'n geboë oppervlak nie."},

{a:"GEO",ch:4,q:"Which 3-D object has one curved surface and two flat surfaces?",
 qAf:"Watter 3D-voorwerp het een geboë oppervlak en twee plat oppervlaktes?",
 fa:"A drawing of a cylinder.",faAf:"'n Tekening van 'n silinder.",
 fig:gSolid("cyl"),
 o:["a sphere","a cone","a cylinder","a pyramid"],oAf:["'n sfeer","'n keël","'n silinder","'n piramide"],ci:2,
 hi:"Think about a tin of beans.",hiAf:"Dink aan 'n blik boontjies.",
 ex:"A cylinder has a flat circle at the top, a flat circle at the bottom, and one curved surface around the outside. A cone has only one flat surface.",
 exAf:"'n Silinder het 'n plat sirkel bo, 'n plat sirkel onder, en een geboë oppervlak rondom. 'n Keël het net een plat oppervlak."},

{a:"GEO",ch:4,nosh:1,q:"The box is a cube and it has no lid. Which net can be folded to build this box?",
 qAf:"Die boks is 'n kubus en het geen deksel nie. Watter net kan gevou word om hierdie boks te bou?",
 fa:"Four nets of five squares each. A is a straight strip of five. B is a row of four with one square joined below the second. C is a two-by-two block with one extra square below the left. D is a staircase.",faAf:"Vier nette van vyf vierkante elk. A is 'n reguit strook van vyf. B is 'n ry van vier met een vierkant onder die tweede vas. C is 'n twee-by-twee blok met een ekstra vierkant onder links. D is 'n trap.",
 fig:gNets(),
 o:["A","B","C","D"],oAf:["A","B","C","D"],ci:1,
 hi:"An open box needs a base and 4 walls, and the walls must wrap around without overlapping.",
 hiAf:"'n Oop boks het 'n basis en 4 mure nodig, en die mure moet toevou sonder om te oorvleuel.",
 ex:"Net B is a strip of 4 squares (the four walls) with one square attached to the middle as the base. In A, C and D the squares overlap or leave a gap when you fold them.",
 exAf:"Net B is 'n strook van 4 vierkante (die vier mure) met een vierkant aan die middel vas as die basis. In A, C en D oorvleuel die vierkante of laat hulle 'n gaping wanneer jy vou."},

{a:"GEO",ch:4,q:"How many vertices does a cube have?<br><span style='font-size:15px'>A vertex is a corner point where edges meet.</span>",
 qAf:"Hoeveel hoekpunte het 'n kubus?<br><span style='font-size:15px'>'n Hoekpunt is 'n hoek waar ribbe bymekaarkom.</span>",
 fa:"A drawing of a cube.",faAf:"'n Tekening van 'n kubus.",
 fig:gSolid("cube"),
 o:["8","4","6","12"],oAf:["8","4","6","12"],ci:0,
 hi:"Count 4 corners on the top face and 4 on the bottom face.",hiAf:"Tel 4 hoeke op die boonste vlak en 4 op die onderste vlak.",
 ex:"A cube has 8 vertices, 12 edges and 6 faces.",exAf:"'n Kubus het 8 hoekpunte, 12 ribbe en 6 vlakke."},

{a:"GEO",ch:4,q:"How many edges does a triangular prism have?",qAf:"Hoeveel ribbe het 'n driehoekige prisma?",
 fa:"A drawing of a triangular prism.",faAf:"'n Tekening van 'n driehoekige prisma.",
 fig:gSolid("triprism"),
 o:["5","9","6","12"],oAf:["5","9","6","12"],ci:1,
 hi:"Count the two triangles, then the edges joining them.",hiAf:"Tel die twee driehoeke, dan die ribbe wat hulle verbind.",
 ex:"Two triangles give 3 + 3 = 6 edges, plus 3 edges joining them = 9 edges.",
 exAf:"Twee driehoeke gee 3 + 3 = 6 ribbe, plus 3 ribbe wat hulle verbind = 9 ribbe."},

{a:"GEO",ch:4,nosh:1,q:"Reflect the shape in the dotted line. What does the shape look like now?",
 qAf:"Weerkaats die vorm in die stippellyn. Hoe lyk die vorm nou?",
 fa:"A flag shape to the left of a dotted vertical line, with its pennant at the top pointing right. Option A shows it moved to the right of the line, still pointing right. B shows it to the right of the line pointing left. C shows it to the left of the line with the pennant at the bottom. D shows it to the right of the line with the pennant at the bottom pointing left.",faAf:"'n Vlagvorm links van 'n vertikale stippellyn, met sy wimpel bo wat na regs wys. Opsie A wys dit regs van die lyn, steeds na regs. B wys dit regs van die lyn na links. C wys dit links van die lyn met die wimpel onder. D wys dit regs van die lyn met die wimpel onder wat na links wys.",
 fig:gReflect(),
 o:["A","B","C","D"],oAf:["A","B","C","D"],ci:1,
 hi:"A mirror image points the other way, but stays the same distance from the line.",
 hiAf:"'n Spieëlbeeld wys die ander kant toe, maar bly ewe ver van die lyn af.",
 ex:"The original points to the right, so its mirror image points to the left and sits the same distance on the other side of the dotted line. That is B.",
 exAf:"Die oorspronklike wys na regs, dus wys die spieëlbeeld na links en lê ewe ver aan die ander kant van die stippellyn. Dit is B."},

{a:"GEO",ch:4,q:"Peter repeats one flag shape around a single point to make a star pattern. Which transformation does he use?",
 qAf:"Peter herhaal een vlagvorm om 'n enkele punt om 'n sterpatroon te maak. Watter transformasie gebruik hy?",
 o:["Rotation","Translation","Reflection"],oAf:["Rotasie","Translasie","Refleksie"],ci:0,
 hi:"The shape turns around a point without flipping over.",hiAf:"Die vorm draai om 'n punt sonder om om te slaan.",
 ex:"Turning a shape around a fixed point is a rotation. A translation slides it and a reflection flips it.",
 exAf:"Om 'n vorm om 'n vaste punt te draai, is 'n rotasie. 'n Translasie skuif dit en 'n refleksie slaan dit om."},

{a:"GEO",ch:4,nosh:1,q:"Which rectangle shows all its lines of symmetry correctly?",
 qAf:"Watter reghoek wys al sy simmetrielyne korrek?",
 fa:"Four identical rectangles. A has both diagonals drawn, B has a horizontal and a vertical line through the middle, C has a vertical line and one diagonal, D has one diagonal.",faAf:"Vier eenderse reghoeke. A het albei diagonale, B het 'n horisontale en 'n vertikale lyn deur die middel, C het 'n vertikale lyn en een diagonaal, D het een diagonaal.",
 fig:gSymmetry(),
 o:["A","B","C","D"],oAf:["A","B","C","D"],ci:1,
 hi:"Fold the rectangle so that the two halves fit exactly on each other.",
 hiAf:"Vou die reghoek sodat die twee helftes presies op mekaar pas.",
 ex:"A rectangle that is not a square has exactly 2 lines of symmetry: one across and one down the middle. The diagonals are not lines of symmetry.",
 exAf:"'n Reghoek wat nie 'n vierkant is nie, het presies 2 simmetrielyne: een dwars en een in die middel af. Die diagonale is nie simmetrielyne nie."},

{a:"GEO",ch:4,q:"What do we call the angle shown here?",qAf:"Wat noem ons die hoek wat hier gewys word?",
 fa:"Two lines meeting at a point, forming an angle a little wider than a square corner.",faAf:"Twee lyne wat by 'n punt ontmoet en 'n hoek vorm wat effens wyer is as 'n vierkantshoek.",
 fig:gAngle(125),
 o:["a right angle","an obtuse angle","a straight angle","an acute angle"],
 oAf:["'n regte hoek","'n stomphoek","'n gestrekte hoek","'n skerphoek"],ci:1,
 hi:"Compare it with the corner of a page, which is 90°.",hiAf:"Vergelyk dit met die hoek van 'n bladsy, wat 90° is.",
 ex:"The angle is bigger than 90° but smaller than 180°, so it is obtuse.",
 exAf:"Die hoek is groter as 90° maar kleiner as 180°, dus is dit 'n stomphoek."},

{a:"GEO",ch:4,nosh:1,q:"Three blocks stand on the floor as shown. Which drawing shows the view from directly above?",
 qAf:"Drie blokke staan op die vloer soos gewys. Watter tekening wys die aansig van reg bo af?",
 fa:"Three cubes standing side by side on the floor in an L-shape, with four candidate plan views: A has four squares, B has two squares in a column, C has three squares in an L, D has two squares placed diagonally.",faAf:"Drie kubusse wat langs mekaar op die vloer in 'n L-vorm staan, met vier moontlike bo-aansigte: A het vier vierkante, B het twee vierkante in 'n kolom, C het drie vierkante in 'n L, D het twee vierkante diagonaal.",
 fig:gStackTop(),
 o:["A","B","C","D"],oAf:["A","B","C","D"],ci:2,
 hi:"From above you see the top of every block, even if one is behind another.",
 hiAf:"Van bo af sien jy die bokant van elke blok, selfs al is een agter 'n ander.",
 ex:"All three blocks stand on the floor, so from above you see three squares in an L-shape. Only drawing C has three squares — A would need four blocks, and B and D only two.",
 exAf:"Al drie blokke staan op die vloer, dus sien jy van bo af drie vierkante in 'n L-vorm. Net tekening C het drie vierkante — A sal vier blokke nodig hê, en B en D net twee."},

/* ---------- CHAPTER 4 · TREASURE ISLAND · measurement ---------- */
{a:"MEA",ch:5,q:"The side of each square is 1 cm. What is the perimeter of this rectangle?",
 qAf:"Die sy van elke vierkant is 1 cm. Wat is die omtrek van hierdie reghoek?",
 fa:"A rectangle on a square grid, nine squares long and four squares wide.",faAf:"'n Reghoek op 'n vierkantrooster, nege vierkante lank en vier vierkante breed.",

 ex:"The rectangle is 9 cm by 4 cm. Perimeter = 9 + 4 + 9 + 4 = 26 cm.",
 exAf:"Die reghoek is 9 cm by 4 cm. Omtrek = 9 + 4 + 9 + 4 = 26 cm."},

{a:"MEA",ch:5,q:"Each square is 1 cm². What is the area of the shaded figure?",

 hi:"Count the shaded blocks row by row: 1, 2, 3, 4, 2.",hiAf:"Tel die gearseerde blokkies ry vir ry: 1, 2, 3, 4, 2.",

{a:"MEA",ch:5,q:"Calculate the volume of this rectangular prism.",qAf:"Bereken die volume van hierdie reghoekige prisma.",

{a:"MEA",ch:5,q:"How many 1 cm cubes fit into this box?",qAf:"Hoeveel 1 cm-kubusse pas in hierdie boks?",
 fa:"An open box labelled 9 cm long, 3 cm wide and 1 cm high, next to a single 1 cm cube.",faAf:"'n Oop boks gemerk 9 cm lank, 3 cm breed en 1 cm hoog, langs 'n enkele 1 cm-kubus.",
 fig:gUnitBox(9,3,1),

 hi:"Work out how many cubes fit along each edge, then multiply.",hiAf:"Werk uit hoeveel kubusse langs elke rand pas, en vermenigvuldig dan.",

{a:"MEA",ch:5,q:"Complete:  2 500 g = ______ kg",qAf:"Voltooi:  2 500 g = ______ kg",
 o:["0,25 kg","250 kg","25 kg","2,5 kg"],oAf:["0,25 kg","250 kg","25 kg","2,5 kg"],ci:3,

{a:"MEA",ch:5,q:"How much water is in this jug?",qAf:"Hoeveel water is in hierdie beker?",
 fa:"A measuring jug with four equally spaced marks. The top mark is labelled 2 litres and the water stands level with the second mark from the bottom.",faAf:"'n Maatbeker met vier gelyk gespasieerde merke. Die boonste merk is 2 liter gemerk en die water staan gelyk met die tweede merk van onder.",
 fig:gJug(0.5,"2 ℓ"),

 hi:"Work out what one mark is worth first.",hiAf:"Werk eers uit hoeveel een merk werd is.",

{a:"MEA",ch:5,q:"Herman ran a 10 km race. A sign says he has only 1 400 metres to go. How many metres had he run?",

{a:"MEA",ch:5,q:"How many hours are there in 180 minutes?",qAf:"Hoeveel uur is daar in 180 minute?",

{a:"MEA",ch:5,q:"A flight was expected at Cape Town International at 20:40. It was delayed by two hours. What is the new expected arrival time?",

{a:"MEA",ch:5,q:"Bongani drove 1 200 km in 15 hours. What was his average speed?",

{a:"MEA",ch:5,q:"A car travels 630 km from Johannesburg to Durban in 7 hours. What is its average speed?",

 fa:"A strip of cardboard divided into equal pieces, with six full pieces marked off and a short piece left over.",faAf:"'n Strook karton wat in gelyke stukke verdeel is, met ses volle stukke afgemerk en 'n kort stukkie wat oorbly.",

{a:"MEA",ch:5,q:"A school has a perimeter of 1 500 m. Two gates of 3 m each are built into the fence. One piece of fencing is 2 m long. How many pieces of fencing are needed?",

function save() {
  try { localStorage.setItem("baviaaneiland:" + S.name.toLowerCase(), JSON.stringify(S)); }
  catch (e) { storageOK = false; }
}
function load(name) {
  try {
    const raw = localStorage.getItem("baviaaneiland:" + name.toLowerCase());
    if (raw) {
      const d = JSON.parse(raw); Object.keys(d).forEach(k => S[k] = d[k]);
      S.badges = S.badges || []; S.earned = S.earned || 0; S.answered = S.answered || 0;
      if (S.hints === undefined) S.hints = true;
      return true;
    }
  } catch (e) { storageOK = false; }
  return false;
}

let actx = null;
function beep(freq, dur, type) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(.09, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function toggleSound() {
  S.sound = !S.sound;
  document.getElementById("btn-sound").innerHTML = S.sound ? ICON.soundOn : ICON.soundOff;
  if (S.sound) sfx("coin");
  save();
}

function goMap() {
  current = null;
  S.lives = 3; topbar();
  renderMap(); show("scr-map");
