function chapterQuestions(ch) {
  const out = [];
  QUESTION_BANK.forEach((q, i) => { if (q.ch === ch) out.push(i); });
  return out;
}
function starsFor(ch) { return S.stars[ch] || 0; }

function nextStop() {
  for (let i = 0; i < CHAPTERS.length; i++) if (S.unlocked.indexOf(i) > -1 && !starsFor(i)) return i;
  const allDone = CHAPTERS.every((c, i) => starsFor(i) > 0);
  return allDone && !S.duelWon ? CHAPTERS.length : -1;
}

function renderMap() {
  const done = CHAPTERS.filter((c, i) => starsFor(i) > 0).length;
  say("map-talk", t("guide"),
    S.lang === "af"
      ? (S.duelWon ? "Die eiland is joune. Vaar gerus weer uit — die vrae skommel elke keer."
        : done === 0 ? "Sewe plekke, een skat. Begin by die hawe." :
          done < CHAPTERS.length ? "Nog " + (CHAPTERS.length - done) + " plek(ke) om te verower voor die duel." :
          "Al sewe gedoen. Kaptein Skurwebaard wag by die duel.")
      : (S.duelWon ? "The island is yours. Sail it again — the questions shuffle every time."
        : done === 0 ? "Seven places, one treasure. Start at the docks." :
          done < CHAPTERS.length ? (CHAPTERS.length - done) + " more place(s) to win before the duel." :
          "All seven done. Captain Scurvybeard is waiting."),
    kees(done === 0 ? "calm" : "happy"));

  const allDone = CHAPTERS.every((c, i) => starsFor(i) > 0);
  const nxt = nextStop();
  let reached = 0;
  CHAPTERS.forEach((c, i) => { if (starsFor(i) > 0) reached = Math.max(reached, i + 1); });
  if (S.duelWon) reached = CHAPTERS.length;

  /* the chart */
  let pins = "";
  CHAPTERS.forEach((c, i) => {
    const open = S.unlocked.indexOf(i) > -1, st = starsFor(i), p = PINS[i];
    pins += `<button type="button" class="pin${open ? "" : " locked"}${st ? " done" : ""}${i === nxt ? " next" : ""}"
      style="left:${p[0]}%;top:${p[1]}%" data-ch="${i}" ${open ? "" : "disabled"}
      aria-label="${i + 1}. ${c.name[S.lang]} — ${open ? st + "/3 " + t("stars") : t("locked")}">
      ${c.icon}<span class="num">${i + 1}</span>
      ${open ? `<span class="pst">${"★".repeat(st)}${"☆".repeat(3 - st)}</span>` : `<span class="lk">${ICON.lock}</span>`}</button>`;
  });
  pins += `<button type="button" class="pin boss${allDone ? "" : " locked"}${nxt === CHAPTERS.length ? " next" : ""}"
    style="left:${DUEL_PIN[0]}%;top:${DUEL_PIN[1]}%" id="boss-pin" ${allDone ? "" : "disabled"}
    aria-label="${t("duelName")} — ${allDone ? "" : t("locked")}">${ICON.skull}
    ${allDone ? (S.duelWon ? `<span class="pst">★★★</span>` : "") : `<span class="lk">${ICON.lock}</span>`}</button>`;
  const mp = nxt >= 0 && nxt < CHAPTERS.length ? PINS[nxt] : DUEL_PIN;
  pins += `<div class="me" style="left:${mp[0] - 5}%;top:${mp[1] - 2}%">${avatarSVG(S.own, 48, "happy")}</div>`;
  const chart = $("chart");
  chart.innerHTML = chartArt(reached) + pins;
  chart.querySelectorAll(".pin[data-ch]").forEach(b => { if (!b.disabled) b.onclick = () => openChapter(+b.dataset.ch); });
  if (allDone) $("boss-pin").onclick = startDuel;

  /* treasure meter */
  const got = CHAPTERS.map((c, i) => starsFor(i)).reduce((a, b) => a + b, 0), max = CHAPTERS.length * 3;
  $("map-progress").innerHTML = `<div class="treasure-meter" role="img" aria-label="${t("progress")}: ${got}/${max} ${t("stars")}">
      ${ICON.star(true)}<div class="bar"><i style="width:${Math.round(got / max * 100)}%"></i></div><b>${got}/${max}</b></div>
    <p class="note" style="margin:-4px 0 12px">${t("progress")}: ${got}/${max} ${t("stars")} · ${S.answered || 0} ${t("answered")}</p>`;

  /* the list, for reading names and for keyboards */
  const g = $("map-grid"); g.innerHTML = "";
  CHAPTERS.forEach((c, i) => {
    const open = S.unlocked.indexOf(i) > -1;
    const st = starsFor(i);
    const b = document.createElement("button");
    b.className = "island" + (open ? "" : " locked") + (st ? " done" : "") + (i === nxt ? " next" : "");
    b.innerHTML = `<div class="island-icon">${c.icon}<span class="num">${i + 1}</span></div>
      <div><h3>${c.name[S.lang]}</h3><p>${c.blurb[S.lang]} · ${chapterQuestions(i).length} ${S.lang === "af" ? "vrae" : "questions"}</p>
      <div class="stars">${open ? "★".repeat(st) + "☆".repeat(3 - st) : "🔒 " + t("locked")}</div></div>`;
    if (open) b.onclick = () => openChapter(i); else b.disabled = true;
    g.appendChild(b);
  });
  const d = document.createElement("button");
  d.className = "island" + (allDone ? "" : " locked") + (nxt === CHAPTERS.length ? " next" : "");
  d.innerHTML = `<div class="island-icon" style="background:radial-gradient(circle at 35% 30%,#5a2a1c,#2b120a)">${ICON.swords}</div>
    <div><h3>${t("duelName")}</h3><p>${S.lang === "af" ? "Die laaste duel · 12 gemengde vrae" : "The final duel · 12 mixed questions"}</p>
    <div class="stars">${allDone ? (S.duelWon ? "★★★" : "⚔️") : "🔒 " + t("locked")}</div></div>`;
  if (allDone) d.onclick = startDuel; else { d.disabled = true; }
  g.appendChild(d);
  topbar();
}

/* ============================================================
   SECTION: CHAPTER INTRO
   ============================================================ */
let current = null;   // {ch, list, pos, tries, duel, hpYou, hpFoe, firstRight}

function openChapter(ch) {
  const c = CHAPTERS[ch];
  $("ch-scene").innerHTML = c.scene();
  say("ch-talk", c.name[S.lang], c.talk[S.lang], npcFace(ch, "calm"));
  const qs = chapterQuestions(ch);
  $("ch-panel").innerHTML = `<h2 class="head">${c.name[S.lang]}</h2>
    <p class="note">${AREA_NAME[c.area][S.lang]} · ${qs.length} ${S.lang === "af" ? "vrae" : "questions"} · ${[0, 1, 2].map(() => ico(ICON.heart(true))).join("")}</p>
    <div class="qbar"><button class="btn" id="go">${t("begin")}</button>
    <button class="btn quiet" onclick="goMap()">${t("back")}</button></div>`;
  $("go").onclick = () => beginChapter(ch);
  show("scr-chapter");
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function beginChapter(ch) {
  S.lives = 3;
  current = { ch:ch, list:shuffle(chapterQuestions(ch)), pos:0, tries:0, duel:false, firstRight:0, results:[] };
  sfx("open");
  $("duel-ui").style.display = "none";
  topbar(); renderQuestion(); show("scr-q");
}

/* ============================================================
   SECTION: QUESTIONS
   ============================================================ */
let shownOrder = [], lastPos = [];

function renderQuestion() {
  const qi = current.list[current.pos], q = QUESTION_BANK[qi];
  const lang = S.lang;
  $("q-meta").textContent = `${t("q")} ${current.pos + 1} ${t("of")} ${current.list.length} · ${AREA_NAME[q.a][lang]}`;
  $("q-text").innerHTML = lang === "af" ? q.qAf : q.q;
  const figHost = $("q-fig");
  figHost.innerHTML = q.fig || "";
  if (q.fig) { figHost.setAttribute("role", "img");
    figHost.setAttribute("aria-label", (lang === "af" ? q.faAf : q.fa) || ""); }
  else { figHost.removeAttribute("role"); figHost.removeAttribute("aria-label"); }

  // Options whose text IS the figure label (A, B, C, D / 1, 2, 3, 4) keep their
  // printed order so the button always matches the picture. Everything else is
  // shuffled, and the correct position may not repeat more than twice in a row.
  const opts = (lang === "af" ? q.oAf : q.o).map((txt, i) => ({ txt:txt, ok:i === q.ci }));
  if (!q.nosh) {
    let guard = 0;
    do { shuffle(opts); guard++; }
    while (guard < 25 && lastPos.length >= 2 &&
           lastPos[lastPos.length - 1] === opts.findIndex(o => o.ok) &&
           lastPos[lastPos.length - 2] === opts.findIndex(o => o.ok));
    lastPos.push(opts.findIndex(o => o.ok)); if (lastPos.length > 6) lastPos.shift();
  }
  shownOrder = opts;

  const box = $("q-opts"); box.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E"];
  opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt" + (q.nosh ? " pick" : ""); b.type = "button";
    b.innerHTML = q.nosh
      ? `<span class="letter">${o.txt}</span>`
      : `<span class="letter">${letters[i]}</span><span>${o.txt}</span>`;
    b.setAttribute("aria-label", (q.nosh ? "" : letters[i] + ". ") + String(o.txt).replace(/<[^>]+>/g, " "));
    b.onclick = () => answer(i, b);
    box.appendChild(b);
  });
  $("q-verdict").innerHTML = "";
  $("q-next").style.display = "none";
  $("q-hint").disabled = false; $("q-show").disabled = false;
  $("q-hint").style.display = S.hints ? "inline-block" : "none";
  current.tries = 0;
  drawVoyage();
  if (current.duel) {
    $("f-foe-art").innerHTML = face(SCURVY, "gloat");
    $("f-you-art").innerHTML = avatarSVG(S.own, 92, "calm", null, true);
    const tl = TAUNTS[S.lang];
    $("duel-taunt").textContent = "“" + tl[current.pos % tl.length] + "”";
  }
  topbar();
}

function lockOptions(revealCorrect) {
  [...$("q-opts").children].forEach((b, i) => {
    b.disabled = true;
    if (revealCorrect && shownOrder[i].ok) b.classList.add("right");
  });
}

function answer(i, btn) {
  const qi = current.list[current.pos], q = QUESTION_BANK[qi];
  const h = S.hist[qi] = S.hist[qi] || { seen:0, first:false, wrong:0 };
  if (shownOrder[i].ok) {
    btn.classList.add("right");
    lockOptions(false);
    h.seen++;
    const first = current.tries === 0;
    if (first) { h.first = true; current.firstRight++; S.coins += 5; S.earned += 5; S.streak++; }
    else { S.coins += 2; S.earned += 2; S.streak = 0; }
    S.answered++;
    if (S.streak > S.best) S.best = S.streak;
    mark(first ? "first" : "second");
    sfx(first ? "right" : "ok");
    coinBurst(btn, first ? 4 : 2);
    if (first) streakCheer();
    verdict("good", "✔ " + t("right") + (first ? " +5 " : " +2 ") + coinTag(), S.lang === "af" ? q.exAf : q.ex);
    if (current.duel) { current.hpFoe -= 9; drawHP("foe"); }
    finishQuestion();
  } else {
    btn.classList.add("wrong");
    current.tries++; h.wrong++; S.streak = 0;
    sfx("wrong"); shakeCard();
    if (current.tries === 1) {
      verdict("hint", "✘ " + t("wrong1"),
        S.hints ? ((S.lang === "af" ? q.hiAf : q.hi) || "") : t("thinkAgain"));
      btn.disabled = true;
      if (current.duel) { current.hpYou -= 7; drawHP("you"); if (current.hpYou <= 0) return endDuel(false); }
    } else {
      lockOptions(true);
      S.lives--;
      mark("miss");
      verdict("bad", "✘ " + t("wrong2"), (S.lang === "af" ? q.exAf : q.ex));
      if (current.duel) { current.hpYou -= 7; drawHP("you"); if (current.hpYou <= 0) return endDuel(false); }
      finishQuestion();
      if (!current.duel && S.lives <= 0) { $("q-next").onclick = chapterFailed; }
    }
  }
  topbar(); checkBadges(); save();
}

function finishQuestion() {
  $("q-hint").disabled = true; $("q-show").disabled = true;
  $("q-next").style.display = "inline-block";
  $("q-next").onclick = nextQuestion;
  $("q-next").focus();
}

function verdict(kind, head, body) {
  let art = "";
  if (current && !current.duel) {
    const mood = kind === "good" ? "happy" : kind === "bad" ? "sad" : "think";
    art = `<div class="portrait" aria-hidden="true">${npcFace(current.ch, mood)}</div>`;
  }
  $("q-verdict").innerHTML = `<div class="verdict ${kind}">${art}<div class="vbody"><span class="vhead">${head}</span>${body}</div></div>`;
}

function askHint() {
  const q = QUESTION_BANK[current.list[current.pos]];
  verdict("hint", "💡 " + t("hint"), (S.lang === "af" ? q.hiAf : q.hi) || (S.lang === "af" ? q.exAf : q.ex) || "");
  $("q-hint").disabled = true;
}
function showMethod() {
  const q = QUESTION_BANK[current.list[current.pos]];
  verdict("hint", "📜 " + t("method"), (S.lang === "af" ? q.exAf : q.ex) || "");
  $("q-show").disabled = true;
}

function nextQuestion() {
  if (current.duel && current.hpFoe <= 0) return endDuel(true);
  if (!current.duel && S.lives <= 0) return chapterFailed();
  current.pos++;
  if (current.pos >= current.list.length) return current.duel ? endDuel(current.hpFoe <= 0 || current.hpYou > current.hpFoe) : chapterDone();
  renderQuestion();
}

function chapterFailed() {
  const ch = current.ch;
  $("ch-scene").innerHTML = CHAPTERS[ch].scene();
  say("ch-talk", CHAPTERS[ch].name[S.lang], t("lostAll"), npcFace(ch, "sad"));
  $("ch-panel").innerHTML = `<div class="reward">
    <div class="chest shut">${chestSVG(false)}</div>
    <h2 class="head">${CHAPTERS[ch].name[S.lang]}</h2>
    <div class="qbar"><button class="btn" onclick="beginChapter(${ch})">${t("again")}</button>
    <button class="btn quiet" onclick="goMap()">${t("back")}</button></div></div>`;
  sfx("lose");
  show("scr-chapter");
}

function chapterDone() {
  const ch = current.ch, n = current.list.length, right = current.firstRight;
  const pct = right / n;
  const st = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
  if (st > starsFor(ch)) S.stars[ch] = st;
  if (S.unlocked.indexOf(ch + 1) === -1 && ch + 1 < CHAPTERS.length) S.unlocked.push(ch + 1);
  S.coins += 10 * st; S.earned += 10 * st;
  checkBadges(); save();
  $("ch-scene").innerHTML = CHAPTERS[ch].scene();
  say("ch-talk", CHAPTERS[ch].name[S.lang],
    (S.lang === "af" ? "Goed gedoen. Die pad na die volgende plek is oop." : "Well done. The road to the next place is open."),
    npcFace(ch, "happy"));
  const starRow = [0, 1, 2].map(i =>
    ICON.star(i < st).replace("<svg ", `<svg style="animation-delay:${(.35 + i * .3).toFixed(2)}s" `)).join("");
  $("ch-panel").innerHTML = `<div class="reward">
    <div class="chest">${chestSVG(true)}</div>
    <h2 class="head">${t("chapDone")}</h2>
    <div class="bigstars" role="img" aria-label="${st}/3 ${t("stars")}">${starRow}</div>
    <p class="line">${right} ${t("of")} ${n} ${t("firstTry")}</p>
    <div class="gain">+${10 * st} ${ICON.coin}</div>
    <div class="qbar"><button class="btn" onclick="goMap()">${t("back")}</button>
    <button class="btn quiet" onclick="beginChapter(${ch})">${t("again")}</button></div></div>`;
  topbar(); bumpStat("tb-coins");
  sfx("fanfare"); coinRain(8 + st * 6);
  show("scr-chapter");
}

/* ============================================================
   SECTION: THE DUEL
   ============================================================ */
const TAUNTS = {
  af:["Jy tel op jou vingers — ek tel jou skatte!",
      "My papegaai kan vinniger deel as jy!",
      "Jou breuke is so onvereenvoudig soos jou maniere!",
      "Ek het al skulpe gesien wat beter afrond as jy!",
      "Jou desimale komma lê skeef, matroos!",
      "Noem jy dít 'n gemiddelde spoed?"],
  en:["You count on your fingers — I count your treasure!",
      "My parrot divides faster than you do!",
      "Your fractions are as unsimplified as your manners!",
      "I have seen seashells round off better than you!",
      "Your decimal comma is leaning, sailor!",
      "You call that an average speed?"]
};

function startDuel() {
  // pick 12: favour questions the learner got wrong or has not seen
  const weak = [], rest = [];
  QUESTION_BANK.forEach((q, i) => {
    const h = S.hist[i];
    ((!h || !h.first) ? weak : rest).push(i);
  });
  const list = shuffle(weak).slice(0, 12);
  while (list.length < 12) { const r = shuffle(rest).pop(); if (r === undefined) break; if (list.indexOf(r) === -1) list.push(r); }
  current = { ch:-1, list:shuffle(list), pos:0, tries:0, duel:true, hpYou:100, hpFoe:100, firstRight:0, results:[] };
  $("duel-ui").style.display = "block";
  $("hp-you-lbl").textContent = t("you"); $("hp-foe-lbl").textContent = t("duelName");
  sfx("open");
  drawHP(); renderQuestion(); show("scr-q");
}
function drawHP(hit) {
  $("hp-you").style.width = Math.max(0, current.hpYou) + "%";
  $("hp-foe").style.width = Math.max(0, current.hpFoe) + "%";
  $("hp-you").classList.toggle("low", current.hpYou <= 30);
  $("hp-foe").classList.toggle("low", current.hpFoe <= 30);
  const list = TAUNTS[S.lang];
  $("duel-taunt").textContent = "“" + list[current.pos % list.length] + "”";
  if (hit) {
    const f = $(hit === "foe" ? "f-foe" : "f-you");
    f.classList.remove("hit"); void f.offsetWidth; f.classList.add("hit");
    $("f-foe-art").innerHTML = face(SCURVY, hit === "foe" ? "hurt" : "gloat");
    $("f-you-art").innerHTML = avatarSVG(S.own, 92, hit === "you" ? "hurt" : "happy", null, true);
  }
}
function endDuel(won) {
  if (won) { S.duelWon = true; S.coins += 100; S.earned += 100; }
  checkBadges(); save();
  $("ch-scene").innerHTML = duelScene();
  say("ch-talk", t("duelName"), won ? t("duelWin") : t("duelLose"), face(SCURVY, won ? "sad" : "gloat"));
  $("ch-panel").innerHTML = `<div class="reward">
    ${won ? `<div class="chest">${chestSVG(true)}</div>` : `<div class="chest shut">${chestSVG(false)}</div>`}
    <h2 class="head">${won ? t("victory") : t("wrong2")}</h2>
    ${won ? `<div class="gain">+100 ${ICON.coin}</div>` : ""}
    <div class="qbar"><button class="btn" onclick="goMap()">${t("back")}</button>
    ${won ? `<button class="btn quiet" onclick="showCert()">${t("cert")}</button>` : `<button class="btn quiet" onclick="startDuel()">${t("again")}</button>`}</div></div>`;
  $("duel-ui").style.display = "none";
  topbar();
  if (won) { sfx("fanfare"); coinRain(36); } else sfx("lose");
  show("scr-chapter");
}

/* ============================================================
   SECTION: CABIN (shop)
   ============================================================ */
function showCabin() {
  const look = S.look || {};
  const items = SHOP.map(it => {
    const has = S.own.indexOf(it.id) > -1;
    const pct = Math.min(100, Math.round(S.coins / it.cost * 100));
    const label = `${t("buy")} · ${it.cost} ${ICON.coin}`;
    return `<div class="shop-item">${avatarSVG([it.id], 84)}<h4>${it.name[S.lang]}</h4>
      ${has ? `<div class="owned">✔ ${t("owned")}</div>`
        : S.coins >= it.cost ? `<button class="btn small" onclick="buy('${it.id}')">${label}</button>`
        : `<button class="btn small quiet" onclick="buy('${it.id}')">${label}</button>
           <div class="need">${it.cost - S.coins} ${t("needMore")}<div class="bar"><i style="width:${pct}%"></i></div></div>`}</div>`;
  }).join("");
  $("info-body").innerHTML = `<h2 class="head">${t("cabin")}</h2>
    <div class="cabin-top">
      <div class="stagebox">${avatarSVG(S.own, 150, "happy")}</div>
      <div><p style="margin:0;font-size:21px"><b>${esc(S.name)}</b></p>
      <p class="note" style="margin:4px 0">${coinTag()} ${S.coins} ${t("coins")} · ${ico(ICON.flame)} ${S.best}</p>
      <p style="margin:14px 0 0;font-weight:700">${t("look")}</p>
      <div class="swatches">${SKINS.map((c, i) => `<button class="swatch" type="button" style="background:${c}"
        aria-pressed="${(look.skin || 0) === i}" aria-label="${t("look")} ${i + 1}" onclick="setSkin(${i})"></button>`).join("")}</div>
      </div></div>
    <h3 class="sub">${S.lang === "af" ? "Te koop" : "For sale"}</h3>
    <div class="shop-grid">${items}</div>
    <h3 class="sub">${t("badges")}</h3>
    ${badgeGrid()}
    <div class="qbar" style="margin-top:14px"><button class="btn quiet" onclick="goMap()">${t("back")}</button></div>`;
  show("scr-info");
}
function setSkin(i) { S.look = Object.assign({}, S.look || {}, { skin:i }); save(); showCabin(); }
function buy(id) {
  const it = SHOP.find(x => x.id === id);
  if (S.own.indexOf(id) > -1) return;
  if (S.coins < it.cost) return toast(t("cantAfford"));
  S.coins -= it.cost; S.own.push(id); sfx("buy"); save(); topbar(); showCabin();
  banner(`<div>${it.name[S.lang]}!</div>`);
}

/* ============================================================
   SECTION: TEACHER PANEL
   ============================================================ */
function renderTeacher() {
  if (!teacherUnlocked()) return goMap();
  const areas = {};
  QUESTION_BANK.forEach((q, i) => {
    const a = areas[q.a] = areas[q.a] || { n:0, seen:0, first:0 };
    a.n++;
    const h = S.hist[i]; if (h) { a.seen++; if (h.first) a.first++; }
  });
  let rows = "", tn = 0, ts = 0, tf = 0;
  Object.keys(AREA_NAME).forEach(k => {
    const a = areas[k]; if (!a) return;
    tn += a.n; ts += a.seen; tf += a.first;
    rows += `<tr><td>${AREA_NAME[k][S.lang]}</td><td>${a.n}</td><td>${a.seen}</td>
      <td>${a.seen ? Math.round(a.first / a.seen * 100) + "%" : "—"}</td></tr>`;
  });
  rows += `<tr><th>${t("total")}</th><th>${tn}</th><th>${ts}</th><th>${ts ? Math.round(tf / ts * 100) + "%" : "—"}</th></tr>`;

  let qrows = "";
  QUESTION_BANK.forEach((q, i) => {
    const h = S.hist[i];
    const ans = (S.lang === "af" ? q.oAf : q.o)[q.ci];
    qrows += `<tr><td>${i + 1}</td><td>${q.a}</td><td>${CHAPTERS[q.ch].name[S.lang]}</td>
      <td>${(S.lang === "af" ? q.qAf : q.q).replace(/<br>/g, " ").replace(/<[^>]+>/g, "")}</td>
      <td><b>${ans}</b></td><td>${h ? (h.first ? "✔" : "✘ ×" + h.wrong) : "—"}</td></tr>`;
  });

  $("info-body").innerHTML = `<h2 class="head">${t("teacher")}</h2>
    <p class="note">${S.name} · ${S.lang === "af" ? "Sterre" : "Stars"}: ${CHAPTERS.map((c, i) => starsFor(i)).reduce((a, b) => a + b, 0)}/${CHAPTERS.length * 3}</p>
    <div class="tscroll"><table><tr><th>${t("area")}</th><th>${S.lang === "af" ? "Vrae" : "Items"}</th><th>${t("attempted")}</th><th>${t("correct1")}</th></tr>${rows}</table></div>
    <h3 class="sub">${t("allQ")}</h3>
    <div class="qlist"><table><tr><th>#</th><th>${t("area")}</th><th>${S.lang === "af" ? "Hoofstuk" : "Chapter"}</th>
      <th>${t("q")}</th><th>${S.lang === "af" ? "Antwoord" : "Answer"}</th><th>${S.lang === "af" ? "Hierdie speler" : "This player"}</th></tr>${qrows}</table></div>
    <h3 class="sub">${t("notes")}</h3>
    <ul class="note" style="line-height:1.6">${CHAPTERS.map((c, i) =>
      `<li><b>${c.name[S.lang]}</b> — ${NOTES[i][S.lang]}</li>`).join("")}</ul>
    <div class="qbar" style="margin-top:14px">
      <button class="btn quiet" onclick="goMap()">${t("back")}</button>
      <button class="btn quiet" onclick="window.print()">${t("print")}</button>
      <button class="btn quiet" onclick="downloadCSV()">${t("download")}</button>
      <span class="spacer"></span>
      <button class="btn quiet" onclick="teacherLogout()">${t("logout")}</button>
      <button class="btn quiet" onclick="resetAll()">${t("reset")}</button></div>`;
  show("scr-info");
}
function resetAll() {
  if (!teacherUnlocked()) return goMap();
  if (!confirm(t("resetAsk"))) return;
  const name = S.name, lang = S.lang, sound = S.sound;
  S = { lang:lang, name:name, coins:0, lives:3, streak:0, best:0, unlocked:[0], stars:{}, own:[], hist:{},
        duelWon:false, sound:sound, hints:S.hints, badges:[], earned:0, answered:0 };
  save(); topbar(); goMap();
}

/* ============================================================
   SECTION: CERTIFICATE
   ============================================================ */
function showCert() {
  const areas = {};
  QUESTION_BANK.forEach((q, i) => {
    const a = areas[q.a] = areas[q.a] || { seen:0, first:0 };
    const h = S.hist[i]; if (h) { a.seen++; if (h.first) a.first++; }
  });
  let rows = "", ts = 0, tf = 0;
  Object.keys(AREA_NAME).forEach(k => {

/* ============================================================
   SECTION: TEACHER ACCESS
   The code is checked in one place only. To move this to a server,
   replace the body of verifyTeacherPassword() with a fetch() that
   returns true or false — nothing else in the game needs to change.
   ============================================================ */
const TEACHER_PASSCODE = "5465";
let teacherFlag = false, codeTries = 0, codeBlockUntil = 0;

function verifyTeacherPassword(code) {
  return String(code).trim() === TEACHER_PASSCODE;
}
function teacherUnlocked() {
  try { if (sessionStorage.getItem("bav:teacher") === "1") return true; } catch (e) {}
  return teacherFlag;
}
function teacherGrant() {
  teacherFlag = true;
  try { sessionStorage.setItem("bav:teacher", "1"); } catch (e) {}
}
function teacherLogout() {
  teacherFlag = false;
  try { sessionStorage.removeItem("bav:teacher"); } catch (e) {}
  toast(t("loggedOut")); goMap();
}
function showTeacher() {            // the only way in
  if (teacherUnlocked()) return renderTeacher();
  openLock();
}
function openLock() {
  $("modal-host").innerHTML = `<div class="modal-back" id="lock-back" role="dialog" aria-modal="true" aria-labelledby="lock-h">
    <div class="modal">
      <h3 id="lock-h">🔒 ${t("teacherLock")}</h3>
      <p>${t("teacherAsk")}</p>
      <input type="password" id="lock-in" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="${t("teacherLock")}">
      <p class="err" id="lock-err" role="alert"></p>
      <div class="qbar"><button class="btn" id="lock-go">${t("unlock")}</button>
      <button class="btn quiet" onclick="closeLock()">${t("cancel")}</button></div>
    </div></div>`;
  const inp = $("lock-in");
  inp.focus();
  $("lock-go").onclick = tryCode;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") tryCode(); if (e.key === "Escape") closeLock(); });
}
function closeLock() { $("modal-host").innerHTML = ""; }
function tryCode() {
  if (Date.now() < codeBlockUntil) { $("lock-err").textContent = t("waitCode"); return; }
  if (verifyTeacherPassword($("lock-in").value)) {
    teacherGrant(); codeTries = 0; closeLock(); renderTeacher(); return;
  }
  codeTries++;
  if (codeTries >= 3) { codeBlockUntil = Date.now() + 10000; codeTries = 0; $("lock-err").textContent = t("waitCode"); }
  else $("lock-err").textContent = t("wrongCode");
  $("lock-in").value = ""; $("lock-in").focus();
  beep(180, .18, "square");
}

function downloadCSV() {
  if (!teacherUnlocked()) return;
  const clean = x => String(x).replace(/<br>/g, " ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const rows = [["No", "CAPS area", "Chapter", "Question", "Correct answer", "Result", "Wrong attempts"]];
  QUESTION_BANK.forEach((q, i) => {
    const h = S.hist[i];
    rows.push([i + 1, q.a, CHAPTERS[q.ch].name[S.lang], clean(S.lang === "af" ? q.qAf : q.q),
      clean((S.lang === "af" ? q.oAf : q.o)[q.ci]),
      h ? (h.first ? "right first time" : "needed a second try") : "not answered", h ? h.wrong : 0]);
  });
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  try {
    const blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");

    a.download = "Baviaaneiland_" + S.name.replace(/\W+/g, "_") + "_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } catch (e) { toast("CSV ✘"); }
}


/* ============================================================
   SECTION: TOUCH INPUT
   Phones fire click about 300 ms after the finger lifts, and only
   after a synthetic sequence. We act on touchend instead, cancel the
   ghost click, and paint a pressed state the moment the finger lands.
   A drag of more than 12 px counts as a scroll, not a tap.
   ============================================================ */
const TAPPABLE = ".btn,.opt,.island,.shop-item button,.pin,.chip,.swatch";
function touchUI() {
  let held = null, moved = false, sx = 0, sy = 0;

  const near = el => (el && el.closest) ? el.closest(TAPPABLE) : null;
  const release = () => { if (held) held.classList.remove("pressed"); held = null; };

  document.addEventListener("touchstart", e => {
    const t = near(e.target);
    if (!t || t.disabled) return;
    held = t; moved = false;
    const p = e.touches[0]; sx = p.clientX; sy = p.clientY;
    t.classList.add("pressed");
  }, { passive:true });

  document.addEventListener("touchmove", e => {
    if (!held || moved) return;
    const p = e.touches[0];
    if (Math.abs(p.clientX - sx) > 12 || Math.abs(p.clientY - sy) > 12) {
      moved = true; held.classList.remove("pressed");
    }
  }, { passive:true });

  document.addEventListener("touchend", e => {
    const t = held;
    release();
    if (!t || moved || t.disabled) return;
    if (near(e.target) !== t) return;          // finger slid off the control
    if (e.cancelable) { e.preventDefault(); t.click(); }   // fire now, suppress the ghost click
  }, { passive:false });

  document.addEventListener("touchcancel", release, { passive:true });

  // iOS Safari otherwise zooms on a fast double tap inside the game
  let lastTap = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTap < 320 && near(e.target) && e.cancelable) e.preventDefault();
    lastTap = now;
  }, { passive:false });
}

   One face builder drives every portrait. Moods:
   calm · happy · sad · think · angry · gloat · hurt
   ============================================================ */
const SKINS = ["#f3d4b4", "#d9a574", "#a86a40", "#6b3f25"];
const HAIRS = ["#2b1a0d", "#2b1a0d", "#1a0f08", "#1a0f08"];

function faceParts(mood, eyeHidden) {
  const K = "#2b1a0d";
  let b = "";
  // brows
  const brows = {
    sad:"M35 36.5 L45 34 M55 34 L65 36.5",
    angry:"M35 34 L45 38.5 M55 38.5 L65 34",
    gloat:"M35 34 L45 38 M55 38 L65 34",
    think:"M35 34 Q40 31 45 34 M55 37 L65 37",
    hurt:"M35 35 L45 37 M55 37 L65 35"
  }[mood] || "M35 36 Q40 33.5 45 36 M55 36 Q60 33.5 65 36";
  b += `<path d="${brows}" stroke="${K}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  // eyes
  const eye = (x, side) => {
    if (eyeHidden && side === "R") return "";
    if (mood === "happy") return `<path d="M${x - 4} 45 q4 -5 8 0" stroke="${K}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    if (mood === "hurt") return side === "L"
      ? `<path d="M${x - 4} 41 l7 3.5 l-7 3.5" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<path d="M${x + 4} 41 l-7 3.5 l7 3.5" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    const dy = mood === "think" ? -1.8 : 0, dx = mood === "think" ? 1.4 : 0;
    return `<ellipse cx="${x}" cy="44.5" rx="3.6" ry="4" fill="#fff"/><circle cx="${x + dx}" cy="${45 + dy}" r="2.3" fill="${K}"/><circle cx="${x + dx + .8}" cy="${44 + dy}" r=".7" fill="#fff"/>`;
  };
  b += eye(41, "L") + eye(59, "R");
  // nose
  b += `<path d="M50 46 q-3.6 6.6 .6 8.4" fill="none" stroke="${K}" stroke-width="2" stroke-linecap="round" opacity=".75"/>`;
  return b;
}
function mouthPart(mood) {
  const K = "#2b1a0d";
  switch (mood) {
    case "happy": return `<path d="M40.5 58 Q50 70 59.5 58 Z" fill="#7a2e1e" stroke="${K}" stroke-width="2" stroke-linejoin="round"/><path d="M42.5 58.4 h15 l-1.2 2.4 h-12.6z" fill="#fff"/>`;
    case "sad": return `<path d="M43 64 Q50 58.5 57 64" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    case "think": return `<path d="M45 61 L55 59.6" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>`;
    case "angry": return `<path d="M42 62 Q50 57 58 62 L58 64 Q50 60 42 64 Z" fill="${K}"/>`;
    case "gloat": return `<path d="M39 57.5 Q50 69 61 57.5 Z" fill="#fff" stroke="${K}" stroke-width="2" stroke-linejoin="round"/><path d="M44 58.6v4.4M48.5 59v5.6M53 59v5M57 58.4v3.6" stroke="${K}" stroke-width="1.3"/>`;
    case "hurt": return `<path d="M42 62 q2 -3 4 0 q2 3 4 0 q2 -3 4 0 q2 3 4 0" stroke="${K}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    default: return `<path d="M43.5 59.5 Q50 64 56.5 59.5" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
}

/* o = { bg, skin, coat, hat, hatC, hair, hairC, long, bun, bald, beard, beardC, stache, patch, ear, glasses, feather, skull } */
function face(o, mood) {
  const K = "#2b1a0d", sk = o.skin, hc = o.hairC || "#2b1a0d";
  let b = `<rect width="100" height="100" fill="${o.bg}"/><circle cx="50" cy="40" r="42" fill="#fff" opacity=".07"/>`;
  if (o.long) b += `<path d="M25 42 Q22 80 32 88 L68 88 Q78 80 75 42 Z" fill="${hc}" stroke="${K}" stroke-width="2"/>`;
  b += `<path d="M10 104 Q12 78 34 73 L66 73 Q88 78 90 104 Z" fill="${o.coat}" stroke="${K}" stroke-width="2.2"/>`;
  b += `<path d="M42 73 L50 86 L58 73" fill="${o.shirt || "#fffaf0"}" stroke="${K}" stroke-width="1.8" stroke-linejoin="round"/>`;
  b += `<rect x="43.5" y="62" width="13" height="12" fill="${sk}" stroke="${K}" stroke-width="2"/>`;
  b += `<ellipse cx="28.5" cy="48" rx="4.6" ry="6.6" fill="${sk}" stroke="${K}" stroke-width="2"/><ellipse cx="71.5" cy="48" rx="4.6" ry="6.6" fill="${sk}" stroke="${K}" stroke-width="2"/>`;
  b += `<ellipse cx="50" cy="46" rx="22" ry="24.5" fill="${sk}" stroke="${K}" stroke-width="2.2"/>`;
  b += `<circle cx="36.5" cy="54" r="4" fill="#e0654a" opacity=".28"/><circle cx="63.5" cy="54" r="4" fill="#e0654a" opacity=".28"/>`;
  // hair (under hats)
  if (o.bald) b += `<path d="M28.5 44 Q27 36 31 32 M71.5 44 Q73 36 69 32" stroke="${hc}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  else if (!o.hat || o.hat === "bandana") b += `<path d="M27.5 44 Q26 20 50 20 Q74 20 72.5 44 Q70 31 58 29 Q52 34 42 30 Q31 32 27.5 44 Z" fill="${hc}" stroke="${K}" stroke-width="2"/>`;
  if (o.bun) b += `<circle cx="50" cy="18" r="8" fill="${hc}" stroke="${K}" stroke-width="2"/>`;
  b += faceParts(mood, o.patch);
  // beard / moustache
  if (o.beard === "full" || o.beard === "big") {
    const low = o.beard === "big" ? 94 : 82;
    b += `<path d="M28 48 Q27 ${low - 12} 50 ${low} Q73 ${low - 12} 72 48 Q70 62 60 64 Q50 60 40 64 Q30 62 28 48 Z" fill="${o.beardC}" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>`;
    if (o.beard === "big") b += `<path d="M42 76 q2 8 -2 13 M50 80 v10 M58 76 q-2 8 2 13" stroke="${K}" stroke-width="1.4" fill="none" opacity=".45"/>`;
  }
  if (o.beard === "goatee") b += `<path d="M44 66 Q50 80 56 66 Q50 69 44 66 Z" fill="${o.beardC}" stroke="${K}" stroke-width="1.8"/>`;
  b += mouthPart(mood);
  if (o.stache || o.beard === "full" || o.beard === "big")
    b += `<path d="M38.5 58.5 Q44 51.5 50 55.5 Q56 51.5 61.5 58.5 Q56 56.5 50 58 Q44 56.5 38.5 58.5 Z" fill="${o.beardC || K}" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/>`;
  if (o.patch) b += `<path d="M28.5 37 L66 42" stroke="${K}" stroke-width="2"/><ellipse cx="59" cy="44.5" rx="6.4" ry="5.6" fill="#1a1008" stroke="${K}" stroke-width="1.6"/>`;
  if (o.glasses) b += `<g fill="#bfe3ec" fill-opacity=".35" stroke="#6d4c08" stroke-width="2"><circle cx="41" cy="45" r="6.2"/><circle cx="59" cy="45" r="6.2"/></g><path d="M47.2 44.6 q2.8 -2 5.6 0" stroke="#6d4c08" stroke-width="2" fill="none"/>`;
  if (o.ear) b += `<circle cx="27" cy="57" r="3" fill="none" stroke="#e0a828" stroke-width="2.2"/>`;
  // hats
  const hcol = o.hatC || "#2b1a0d";
  if (o.hat === "tricorn") {
    b += `<path d="M22 28 Q50 -4 78 28 Z" fill="${hcol}" stroke="${K}" stroke-width="2"/>`;
    b += `<path d="M12 31 Q50 12 88 31 Q72 26 50 27 Q28 26 12 31 Z" fill="${hcol}" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>`;
    b += `<path d="M14 31 Q50 14 86 31" stroke="#e0a828" stroke-width="1.8" fill="none"/>`;
    if (o.skull) b += `<g transform="translate(43 8) scale(.27)">${ICON.skull.replace(/<\/?svg[^>]*>/g, "")}</g>`;
    if (o.feather) b += `<path d="M70 26 Q88 6 94 -2 Q86 16 72 28 Z" fill="${o.feather}" stroke="${K}" stroke-width="1.6"/>`;
  } else if (o.hat === "cap") {
    b += `<path d="M27 32 Q27 15 50 15 Q73 15 73 32 Z" fill="${hcol}" stroke="${K}" stroke-width="2"/>`;
    b += `<rect x="27" y="28" width="46" height="5" fill="#fffaf0" stroke="${K}" stroke-width="1.6"/>`;
    b += `<path d="M26 33 Q50 42 74 33 L73 36.5 Q50 45 27 36.5 Z" fill="#1a1008"/>`;
    b += `<circle cx="50" cy="22.5" r="3.6" fill="#e0a828" stroke="${K}" stroke-width="1.2"/>`;
  } else if (o.hat === "bandana") {
    b += `<path d="M27 37 Q27 17 50 17 Q73 17 73 37 Q50 29 27 37 Z" fill="${hcol}" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>`;
    b += `<circle cx="38" cy="25" r="1.8" fill="#fffaf0" opacity=".85"/><circle cx="50" cy="22" r="1.8" fill="#fffaf0" opacity=".85"/><circle cx="62" cy="25" r="1.8" fill="#fffaf0" opacity=".85"/>`;
    b += `<path d="M71 31 l12 3 l-3 5 z M71 33 l10 9 l-5 3 z" fill="${hcol}" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/>`;
  } else if (o.hat === "straw") {
    b += `<path d="M34 28 Q34 11 50 11 Q66 11 66 28 Z" fill="#e8c46a" stroke="${K}" stroke-width="2"/>`;
    b += `<rect x="34" y="22" width="32" height="5" fill="#d2553c"/>`;
    b += `<ellipse cx="50" cy="29" rx="36" ry="7.5" fill="#e8c46a" stroke="${K}" stroke-width="2"/>`;
    b += `<path d="M20 29 h60 M26 26 l4 6 M40 25 l2 7 M58 25 l-1 7 M72 26 l-3 6" stroke="#a8823a" stroke-width="1" opacity=".7"/>`;
  } else if (o.hat === "scarf") {
    b += `<path d="M25.5 50 Q21 17 50 16 Q79 17 74.5 50 Q72 30 50 28.5 Q28 30 25.5 50 Z" fill="${hcol}" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>`;
    b += `<path d="M36 20 q14 -12 28 0" stroke="#fffaf0" stroke-width="1.8" fill="none" stroke-dasharray="2 3"/>`;
    b += `<path d="M47 16 q3 -10 10 -8 q-2 6 -6 9 z" fill="${hcol}" stroke="${K}" stroke-width="1.6"/>`;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${b}</svg>`;
}

/* Kees the chacma baboon — the island's guide */
function kees(mood) {
  const K = "#1f140c", fur = "#8f7c63", mane = "#6e5d49", mask = "#4e3f3a";
  let b = `<rect width="100" height="100" fill="#1f6d54"/><circle cx="50" cy="40" r="42" fill="#fff" opacity=".07"/>`;
  b += `<path d="M10 104 Q12 78 34 72 L66 72 Q88 78 90 104 Z" fill="${mane}" stroke="${K}" stroke-width="2.2"/>`;
  b += `<path d="M32 80 L50 94 L68 80 L64 74 L50 84 L36 74 Z" fill="#d2553c" stroke="${K}" stroke-width="1.8" stroke-linejoin="round"/>`;
  // shaggy mane
  let m = "";
  for (let k = 0; k < 18; k++) {
    const a = Math.PI * 2 * k / 18, r = k % 2 ? 31 : 36;
    m += (k ? " L" : "M") + (50 + r * Math.cos(a)).toFixed(1) + " " + (46 + r * Math.sin(a) * .95).toFixed(1);
  }
  b += `<path d="${m} Z" fill="${mane}" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>`;
  b += `<circle cx="25" cy="34" r="5.5" fill="${mask}" stroke="${K}" stroke-width="1.8"/><circle cx="75" cy="34" r="5.5" fill="${mask}" stroke="${K}" stroke-width="1.8"/>`;
  b += `<ellipse cx="50" cy="44" rx="24" ry="25" fill="${fur}" stroke="${K}" stroke-width="2.2"/>`;
  b += `<path d="M27 32 Q30 18 50 18 Q70 18 73 32 Q62 26 50 27 Q38 26 27 32 Z" fill="#d2553c" stroke="${K}" stroke-width="1.8"/>`;
  b += `<circle cx="40" cy="23" r="1.6" fill="#fffaf0"/><circle cx="50" cy="21" r="1.6" fill="#fffaf0"/><circle cx="60" cy="23" r="1.6" fill="#fffaf0"/>`;
  b += `<path d="M72 28 l11 -1 l-3 6 z" fill="#d2553c" stroke="${K}" stroke-width="1.4"/>`;
  // dark face mask round the eyes and down the snout
  b += `<path d="M33 42 Q33 33 42 33 Q50 35 58 33 Q67 33 67 42 Q66 49 60 50 L40 50 Q34 49 33 42 Z" fill="${mask}"/>`;
  const brow = { sad:"M34 36 Q41 32 48 34.5 M52 34.5 Q59 32 66 36", think:"M34 34 Q41 29 48 33 M52 36 L66 36" }[mood] || "M34 35 Q41 31 48 35 M52 35 Q59 31 66 35";
  b += `<path d="${brow}" stroke="${K}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
  if (mood === "happy") {
    b += `<path d="M37.5 42 q4 -4.4 8 0 M54.5 42 q4 -4.4 8 0" stroke="#f3dcb8" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  } else {
    const up = mood === "think" ? -1.4 : 0;
    b += `<ellipse cx="41.5" cy="41" rx="4.4" ry="3.8" fill="#eab04a"/><ellipse cx="58.5" cy="41" rx="4.4" ry="3.8" fill="#eab04a"/>`;
    b += `<circle cx="42" cy="${41.3 + up}" r="2.1" fill="${K}"/><circle cx="59" cy="${41.3 + up}" r="2.1" fill="${K}"/>`;
    b += `<circle cx="42.8" cy="${40.4 + up}" r=".7" fill="#fff"/><circle cx="59.8" cy="${40.4 + up}" r=".7" fill="#fff"/>`;
  }
  // light chin, then the long snout over it
  b += `<ellipse cx="50" cy="66" rx="15" ry="9" fill="#b3a189" stroke="${K}" stroke-width="1.8"/>`;
  b += `<path d="M39.5 46 Q36 62 40 67 Q50 71.5 60 67 Q64 62 60.5 46 Q50 43 39.5 46 Z" fill="${mask}" stroke="${K}" stroke-width="2"/>`;
  b += `<path d="M44.5 48 Q43 56 44.5 62" stroke="#8a7870" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  b += `<path d="M42 64 Q50 60 58 64" stroke="#3a2e2a" stroke-width="2.4" fill="none"/>`;
  b += `<ellipse cx="46" cy="64.6" rx="2.3" ry="1.5" fill="${K}"/><ellipse cx="54" cy="64.6" rx="2.3" ry="1.5" fill="${K}"/>`;
  const mouth = {
    happy:`<path d="M41 70 Q50 79 59 70 Q50 72.5 41 70 Z" fill="#7a2e1e" stroke="${K}" stroke-width="1.8" stroke-linejoin="round"/><path d="M44 71 h12" stroke="#fff" stroke-width="1.8"/>`,
    sad:`<path d="M43 74.5 Q50 70 57 74.5" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
    think:`<path d="M44 72.5 L56 71.4" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>`
  }[mood] || `<path d="M43 71 Q50 75.5 57 71" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  b += mouth;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${b}</svg>`;
}

/* chapter hosts, in chapter order */

  { bg:"#6b4526", skin:SKINS[3], coat:"#3fb8a0", hat:"scarf", hatC:"#d2553c", ear:true, shirt:"#efdfbb" },

];
const SCURVY = { bg:"#5a1a12", skin:"#e8b48f", coat:"#7a1d12", hat:"tricorn", hatC:"#1a1008", skull:true,
  beard:"big", beardC:"#c2521f", patch:true, ear:true, shirt:"#e8e2d4" };
const npcFace = (ch, mood) => ch < 0 ? face(SCURVY, mood) : face(NPC[ch] || NPC[0], mood);

/* ============================================================
   SECTION: VISUAL UPGRADE — SCENERY HELPERS
   ============================================================ */
function starField(n, w, h, seed) {
  let s = "", x = seed || 7;
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) {
    s += `<circle cx="${(rnd() * w).toFixed(0)}" cy="${(rnd() * h).toFixed(0)}" r="${(0.8 + rnd() * 1.4).toFixed(1)}" fill="#f4ecd8" class="a-twinkle" style="animation-delay:${(-rnd() * 3).toFixed(1)}s"/>`;
  }
  return s;
}
const moonGlow = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r * 2.2}" fill="#f4ecd8" opacity=".07"/><circle cx="${x}" cy="${y}" r="${r * 1.5}" fill="#f4ecd8" opacity=".1"/>`;

function duelScene() {
  return scene(`<defs><linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1b0f1a"/><stop offset="100%" stop-color="#5a1a12"/></linearGradient></defs>

  if (pts.length < 2) return "";

  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0]} ${p2[1]}`;

/* ============================================================
   SECTION: VISUAL UPGRADE — EFFECTS
   ============================================================ */
function bumpStat(id) {
  const el = $(id); if (!el) return;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
}
function coinBurst(fromEl, n) {
  const target = $("tb-coins");
  if (reduceMotion() || !fromEl || !target || !document.body.animate) { bumpStat("tb-coins"); return; }
  const a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
  const sx = a.left + a.width / 2 - 13, sy = a.top + a.height / 2 - 13;
  const tx = b.left + 14 - sx, ty = b.top + b.height / 2 - 13 - sy;
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "flycoin"; c.innerHTML = ICON.coin;
    c.style.transform = `translate(${sx}px,${sy}px)`;
    document.body.appendChild(c);
    const spread = (i - (n - 1) / 2) * 34;
    const anim = c.animate([
      { transform:`translate(${sx}px,${sy}px) scale(.6)`, opacity:0 },
      { transform:`translate(${sx + spread}px,${sy - 50}px) scale(1.15)`, opacity:1, offset:.3 },
      { transform:`translate(${sx + tx}px,${sy + ty}px) scale(.7)`, opacity:.9 }
    ], { duration:720 + i * 110, easing:"cubic-bezier(.45,0,.55,1)", fill:"forwards" });
    anim.onfinish = () => { c.remove(); bumpStat("tb-coins"); if (i === n - 1) sfx("coin"); };
  }
}
function coinRain(n) {
  if (reduceMotion()) return;
  const host = document.createElement("div");
  host.className = "rain";
  let h = "";
  for (let i = 0; i < n; i++) {
    h += `<span style="left:${Math.round(Math.random() * 96)}%;animation-duration:${(1.6 + Math.random() * 1.4).toFixed(2)}s;animation-delay:${(Math.random() * .8).toFixed(2)}s">${ICON.coin}</span>`;
  }
  host.innerHTML = h;
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 3600);
}
function banner(html) {
  if (reduceMotion()) return;
  const d = document.createElement("div");
  d.className = "banner"; d.innerHTML = html;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1600);
}

/* dialogue text types itself; tap to finish at once */
function typeText(node, text) {
  const host = node.closest(".dialogue");
  if (host && host._tt) clearInterval(host._tt);
  if (reduceMotion() || /[<&]/.test(text)) { node.innerHTML = text; return; }
  const chars = [...text];
  let i = 0;
  node.textContent = "";
  const finish = () => { if (host) { clearInterval(host._tt); host._tt = null; host.onclick = null; } node.textContent = text; };
  const tick = () => {
    i += 2;
    node.textContent = chars.slice(0, i).join("");
    if (i >= chars.length) finish();
  };
  if (host) { host._tt = setInterval(tick, 22); host.onclick = finish; }
  else node.textContent = text;
}

/* ============================================================
   SECTION: VISUAL UPGRADE — SOUND
   Short tunes from the Web Audio API. No sound files.
   ============================================================ */
function sfx(kind) {
  if (!S.sound) return;
  const tunes = {
    right:[[659, .08], [880, .08], [1175, .16]],
    ok:[[659, .1], [784, .14]],
    wrong:[[233, .12, "square"], [175, .2, "square"]],
    coin:[[1568, .05], [2093, .09]],
    streak:[[784, .06], [988, .06], [1175, .06], [1568, .18]],
    fanfare:[[523, .12], [659, .12], [784, .12], [1047, .34]],
    hit:[[180, .1, "sawtooth"], [120, .12, "sawtooth"]],
    lose:[[392, .18], [330, .18], [262, .34]],
    open:[[440, .06], [660, .08]],
    buy:[[880, .07], [1320, .07], [1760, .14]]
  };
  const seq = tunes[kind]; if (!seq) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let at = actx.currentTime + .01;
    seq.forEach(([f, d, type]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(.1, at + .012);
      g.gain.exponentialRampToValueAtTime(.0001, at + d);
      o.connect(g); g.connect(actx.destination); o.start(at); o.stop(at + d + .02);
      at += d * .9;
    });
  } catch (e) {}
}

/* ============================================================

   ============================================================ */
function drawVoyage() {
  const host = $("q-voyage"); if (!host || !current) return;
  const n = current.list.length, res = current.results || [];
  let h = `<div class="dots" role="img" aria-label="${t("q")} ${current.pos + 1} ${t("of")} ${n}">`;
  for (let i = 0; i < n; i++) {
    if (i === current.pos && !res[i]) h += `<span class="dot now">${ICON.ship}</span>`;
    else h += `<span class="dot ${res[i] || ""}"></span>`;
  }
  h += `<span class="dot end">${current.duel ? ICON.skull : ICON.flagX}</span></div>`;
  host.innerHTML = h;
}
function mark(kind) {
  if (!current) return;
  current.results = current.results || [];
  current.results[current.pos] = kind;
  drawVoyage();
}

/* ============================================================
   SECTION: VISUAL UPGRADE — RETURNING PLAYERS
   ============================================================ */
function savedPlayers() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.indexOf("baviaaneiland:") !== 0) continue;
      const d = JSON.parse(localStorage.getItem(k) || "null");
      if (!d || !d.name) continue;
      const st = Object.keys(d.stars || {}).reduce((a, x) => a + (d.stars[x] || 0), 0);
      out.push({ name:d.name, stars:st, own:d.own || [], look:d.look });
    }
  } catch (e) {}
  return out.slice(0, 6);
}
function renderPlayers() {
  const host = $("t-players"); if (!host) return;
  const list = savedPlayers();
  if (!list.length) { host.innerHTML = ""; return; }
  host.innerHTML = `<p>${S.lang === "af" ? "Of speel verder as:" : "Or carry on as:"}</p>
    <div class="chips">${list.map((p, i) => `<button class="chip" type="button" data-i="${i}">${avatarSVG(p.own, 36, "happy", p.look, true)}
      <span>${esc(p.name)} <small>★ ${p.stars}</small></span></button>`).join("")}</div>`;
  [...host.querySelectorAll(".chip")].forEach(b => {
    b.onclick = () => { $("nameIn").value = list[+b.dataset.i].name; startGame(); };
  });
}
const ico = s => `<span class="ico">${s}</span>`;

   SECTION: BOOT
   ============================================================ */
(function boot() {
  $("title-scene").innerHTML = heroScene();
  $("t-kees").innerHTML = kees("happy");
  $("f-vs").innerHTML = ICON.swords;
  $("nameIn").addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("scr-intro").classList.contains("on")) return skipIntro();
    if (!$("scr-q").classList.contains("on")) return;
    if (e.key === "Enter" && $("q-next").style.display !== "none") return nextQuestion();
    const n = "1234".indexOf(e.key);
    if (n > -1 && !/input|textarea/i.test((e.target.tagName || ""))) {
      const b = $("q-opts").children[n];
      if (b && !b.disabled) { b.focus(); b.click(); }
    }
  });
  toggleLang(); toggleLang();   // paint both languages once, ends on Afrikaans
  touchUI();
  runIntro();
})();
