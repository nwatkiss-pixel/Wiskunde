let current = null;   // {ch, list, pos, tries, duel, hpYou, hpFoe, firstRight}

function openChapter(ch) {
  const c = CHAPTERS[ch];
  $("ch-scene").innerHTML = c.scene();
  say("ch-talk", c.name[S.lang], c.talk[S.lang]);
  const qs = chapterQuestions(ch);
  $("ch-panel").innerHTML = `<h2 class="head">${c.name[S.lang]}</h2>
    <p class="note">${AREA_NAME[c.area][S.lang]} · ${qs.length} ${S.lang === "af" ? "vrae" : "questions"} · 💀💀💀</p>
    <div class="qbar"><button class="btn" id="go">${t("begin")}</button>
    <button class="btn quiet" onclick="goMap()">${t("back")}</button></div>`;
  $("go").onclick = () => beginChapter(ch);
  show("scr-chapter");
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function beginChapter(ch) {
  S.lives = 3;
  current = { ch:ch, list:shuffle(chapterQuestions(ch)), pos:0, tries:0, duel:false, firstRight:0 };
  $("duel-ui").style.display = "none";
  topbar(); renderQuestion(); show("scr-q");
}

/* ============================================================
   SECTION: QUESTIONS
   ============================================================ */
let shownOrder = [], lastPos = [];

function renderQuestion() {
  const qi = current.list[current.pos], q = QUESTION_BANK[qi];
  const lang = S.lang;
  $("q-meta").textContent = `${t("q")} ${current.pos + 1} ${t("of")} ${current.list.length} · ${AREA_NAME[q.a][lang]}`;
  $("q-text").innerHTML = lang === "af" ? q.qAf : q.q;
  const figHost = $("q-fig");
  figHost.innerHTML = q.fig || "";
  if (q.fig) { figHost.setAttribute("role", "img");
    figHost.setAttribute("aria-label", (lang === "af" ? q.faAf : q.fa) || ""); }
  else { figHost.removeAttribute("role"); figHost.removeAttribute("aria-label"); }

  // Options whose text IS the figure label (A, B, C, D / 1, 2, 3, 4) keep their
  // printed order so the button always matches the picture. Everything else is
  // shuffled, and the correct position may not repeat more than twice in a row.
  const opts = (lang === "af" ? q.oAf : q.o).map((txt, i) => ({ txt:txt, ok:i === q.ci }));
  if (!q.nosh) {
    let guard = 0;
    do { shuffle(opts); guard++; }
    while (guard < 25 && lastPos.length >= 2 &&
           lastPos[lastPos.length - 1] === opts.findIndex(o => o.ok) &&
           lastPos[lastPos.length - 2] === opts.findIndex(o => o.ok));
    lastPos.push(opts.findIndex(o => o.ok)); if (lastPos.length > 6) lastPos.shift();
  }
  shownOrder = opts;

  const box = $("q-opts"); box.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E"];
  opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt" + (q.nosh ? " pick" : ""); b.type = "button";
    b.innerHTML = q.nosh
      ? `<span class="letter">${o.txt}</span>`
      : `<span class="letter">${letters[i]}</span><span>${o.txt}</span>`;
    b.setAttribute("aria-label", (q.nosh ? "" : letters[i] + ". ") + String(o.txt).replace(/<[^>]+>/g, " "));
    b.onclick = () => answer(i, b);
    box.appendChild(b);
  });
  $("q-verdict").innerHTML = "";
  $("q-next").style.display = "none";
  $("q-hint").disabled = false; $("q-show").disabled = false;
  $("q-hint").style.display = S.hints ? "inline-block" : "none";
  current.tries = 0;
  topbar();
}

function lockOptions(revealCorrect) {
  [...$("q-opts").children].forEach((b, i) => {
    b.disabled = true;
    if (revealCorrect && shownOrder[i].ok) b.classList.add("right");
  });
}

function answer(i, btn) {
  const qi = current.list[current.pos], q = QUESTION_BANK[qi];
  const h = S.hist[qi] = S.hist[qi] || { seen:0, first:false, wrong:0 };
  if (shownOrder[i].ok) {
    btn.classList.add("right");
    lockOptions(false);
    h.seen++;
    if (current.tries === 0) { h.first = true; current.firstRight++; S.coins += 5; S.earned += 5; S.streak++; }
    else { S.coins += 2; S.earned += 2; S.streak = 0; }
    S.answered++;
    if (S.streak > S.best) S.best = S.streak;
    beep(880, .12); if (S.streak && S.streak % 3 === 0) beep(1180, .18);
    verdict("good", "✔ " + t("right") + (current.tries === 0 ? " +5 🪙" : " +2 🪙"), S.lang === "af" ? q.exAf : q.ex);
    if (current.duel) { current.hpFoe -= 9; drawHP(); }
    finishQuestion();
  } else {
    btn.classList.add("wrong");
    current.tries++; h.wrong++; S.streak = 0;
    beep(200, .2, "square");
    if (current.tries === 1) {
      verdict("hint", "✘ " + t("wrong1"),
        S.hints ? ((S.lang === "af" ? q.hiAf : q.hi) || "") : t("thinkAgain"));
      btn.disabled = true;
      if (current.duel) { current.hpYou -= 7; drawHP(); if (current.hpYou <= 0) return endDuel(false); }
    } else {
      lockOptions(true);
      S.lives--;
      verdict("bad", "✘ " + t("wrong2"), (S.lang === "af" ? q.exAf : q.ex));
      if (current.duel) { current.hpYou -= 7; drawHP(); if (current.hpYou <= 0) return endDuel(false); }
      finishQuestion();
      if (!current.duel && S.lives <= 0) { $("q-next").onclick = chapterFailed; }
    }
  }
  topbar(); checkBadges(); save();
}

function finishQuestion() {
  $("q-hint").disabled = true; $("q-show").disabled = true;
  $("q-next").style.display = "inline-block";
  $("q-next").onclick = nextQuestion;
  $("q-next").focus();
}

function verdict(kind, head, body) {
  $("q-verdict").innerHTML = `<div class="verdict ${kind}"><span class="vhead">${head}</span>${body}</div>`;
}

function askHint() {
  const q = QUESTION_BANK[current.list[current.pos]];
  verdict("hint", "💡 " + t("hint"), (S.lang === "af" ? q.hiAf : q.hi) || (S.lang === "af" ? q.exAf : q.ex) || "");
  $("q-hint").disabled = true;
}
function showMethod() {
  const q = QUESTION_BANK[current.list[current.pos]];
  verdict("hint", "📜 " + t("method"), (S.lang === "af" ? q.exAf : q.ex) || "");
  $("q-show").disabled = true;
}

function nextQuestion() {
  if (current.duel && current.hpFoe <= 0) return endDuel(true);
  if (!current.duel && S.lives <= 0) return chapterFailed();
  current.pos++;
  if (current.pos >= current.list.length) return current.duel ? endDuel(current.hpFoe <= 0 || current.hpYou > current.hpFoe) : chapterDone();
  renderQuestion();
}

function chapterFailed() {
  $("ch-scene").innerHTML = CHAPTERS[current.ch].scene();
  say("ch-talk", CHAPTERS[current.ch].name[S.lang], t("lostAll"));
  $("ch-panel").innerHTML = `<h2 class="head">${CHAPTERS[current.ch].name[S.lang]}</h2>
    <div class="qbar"><button class="btn" onclick="beginChapter(${current.ch})">${t("again")}</button>
    <button class="btn quiet" onclick="goMap()">${t("back")}</button></div>`;
  show("scr-chapter");
}

function chapterDone() {
  const ch = current.ch, n = current.list.length, right = current.firstRight;
  const pct = right / n;
  const st = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
  if (st > starsFor(ch)) S.stars[ch] = st;
  if (S.unlocked.indexOf(ch + 1) === -1 && ch + 1 < CHAPTERS.length) S.unlocked.push(ch + 1);
  S.coins += 10 * st; S.earned += 10 * st;
  checkBadges(); save();
  $("ch-scene").innerHTML = CHAPTERS[ch].scene();
  say("ch-talk", CHAPTERS[ch].name[S.lang],
    (S.lang === "af" ? "Goed gedoen. Die pad na die volgende plek is oop." : "Well done. The road to the next place is open."));
  $("ch-panel").innerHTML = `<h2 class="head">${t("chapDone")}</h2>
    <p style="font-size:30px;color:var(--brass);margin:4px 0">${"★".repeat(st)}${"☆".repeat(3 - st)}</p>
    <p>${right} ${t("of")} ${n} ${t("firstTry")} · +${10 * st} 🪙</p>
    <div class="qbar"><button class="btn" onclick="goMap()">${t("back")}</button>
    <button class="btn quiet" onclick="beginChapter(${ch})">${t("again")}</button></div>`;
  beep(700, .12); setTimeout(() => beep(900, .16), 130);
  show("scr-chapter");
}

      "Jou breuke is so onvereenvoudig soos jou maniere!",

  en:["You count on your fingers — I count your treasure!",

      "Your fractions are as unsimplified as your manners!",
      "I have seen seashells round off better than you!",
      "Your decimal comma is leaning, sailor!",
      "You call that an average speed?"]
};

function startDuel() {
  // pick 12: favour questions the learner got wrong or has not seen
  const weak = [], rest = [];
  QUESTION_BANK.forEach((q, i) => {
    const h = S.hist[i];
    ((!h || !h.first) ? weak : rest).push(i);
  });
  const list = shuffle(weak).slice(0, 12);
  while (list.length < 12) { const r = shuffle(rest).pop(); if (r === undefined) break; if (list.indexOf(r) === -1) list.push(r); }
  current = { ch:-1, list:shuffle(list), pos:0, tries:0, duel:true, hpYou:100, hpFoe:100, firstRight:0 };
  $("duel-ui").style.display = "block";
  $("hp-you-lbl").textContent = t("you"); $("hp-foe-lbl").textContent = t("duelName");
  drawHP(); renderQuestion(); show("scr-q");
}
function drawHP() {
  $("hp-you").style.width = Math.max(0, current.hpYou) + "%";
  $("hp-foe").style.width = Math.max(0, current.hpFoe) + "%";
  const list = TAUNTS[S.lang];
  $("duel-taunt").textContent = "“" + list[current.pos % list.length] + "”";
}
function endDuel(won) {
  if (won) { S.duelWon = true; S.coins += 100; S.earned += 100; }
  checkBadges(); save();
  $("ch-scene").innerHTML = CHAPTERS[6].scene();
  say("ch-talk", t("duelName"), won ? t("duelWin") : t("duelLose"));
  $("ch-panel").innerHTML = `<h2 class="head">${won ? "🏴‍☠️ " + t("duelWin") : t("duelLose")}</h2>
    <div class="qbar"><button class="btn" onclick="goMap()">${t("back")}</button>
    ${won ? `<button class="btn quiet" onclick="showCert()">${t("cert")}</button>` : `<button class="btn quiet" onclick="startDuel()">${t("again")}</button>`}</div>`;
  $("duel-ui").style.display = "none";
  show("scr-chapter");
}

function spawnSymbols() {

const TEACHER_PASSCODE = "5465";
let teacherFlag = false, codeTries = 0, codeBlockUntil = 0;

function verifyTeacherPassword(code) {

function teacherUnlocked() {
  try { if (sessionStorage.getItem("bav:teacher") === "1") return true; } catch (e) {}
  return teacherFlag;
}
function teacherGrant() {
  teacherFlag = true;
  try { sessionStorage.setItem("bav:teacher", "1"); } catch (e) {}
}
function teacherLogout() {
  teacherFlag = false;
  try { sessionStorage.removeItem("bav:teacher"); } catch (e) {}
  toast(t("loggedOut")); goMap();
}
function showTeacher() {            // the only way in
  if (teacherUnlocked()) return renderTeacher();
  openLock();
}
function openLock() {
  $("modal-host").innerHTML = `<div class="modal-back" id="lock-back" role="dialog" aria-modal="true" aria-labelledby="lock-h">
    <div class="modal">
      <h3 id="lock-h">🔒 ${t("teacherLock")}</h3>
      <p>${t("teacherAsk")}</p>
      <input type="password" id="lock-in" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="${t("teacherLock")}">
      <p class="err" id="lock-err" role="alert"></p>
      <div class="qbar"><button class="btn" id="lock-go">${t("unlock")}</button>
      <button class="btn quiet" onclick="closeLock()">${t("cancel")}</button></div>
    </div></div>`;
  const inp = $("lock-in");
  inp.focus();
  $("lock-go").onclick = tryCode;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") tryCode(); if (e.key === "Escape") closeLock(); });
}
function closeLock() { $("modal-host").innerHTML = ""; }
function tryCode() {
  if (Date.now() < codeBlockUntil) { $("lock-err").textContent = t("waitCode"); return; }
  if (verifyTeacherPassword($("lock-in").value)) {
    teacherGrant(); codeTries = 0; closeLock(); renderTeacher(); return;
  }
  codeTries++;
  if (codeTries >= 3) { codeBlockUntil = Date.now() + 10000; codeTries = 0; $("lock-err").textContent = t("waitCode"); }
  else $("lock-err").textContent = t("wrongCode");
  $("lock-in").value = ""; $("lock-in").focus();
  beep(180, .18, "square");
}

   ============================================================ */
function downloadCSV() {
  if (!teacherUnlocked()) return;
  const clean = x => String(x).replace(/<br>/g, " ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const rows = [["No", "CAPS area", "Chapter", "Question", "Correct answer", "Result", "Wrong attempts"]];
  QUESTION_BANK.forEach((q, i) => {
    const h = S.hist[i];
    rows.push([i + 1, q.a, CHAPTERS[q.ch].name[S.lang], clean(S.lang === "af" ? q.qAf : q.q),
      clean((S.lang === "af" ? q.oAf : q.o)[q.ci]),
      h ? (h.first ? "right first time" : "needed a second try") : "not answered", h ? h.wrong : 0]);
  });
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  try {
    const blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Baviaaneiland_" + S.name.replace(/\W+/g, "_") + "_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } catch (e) { toast("CSV ✘"); }
}


/* ============================================================
   SECTION: TOUCH INPUT
   Phones fire click about 300 ms after the finger lifts, and only
   after a synthetic sequence. We act on touchend instead, cancel the
   ghost click, and paint a pressed state the moment the finger lands.
   A drag of more than 12 px counts as a scroll, not a tap.
   ============================================================ */
const TAPPABLE = ".btn,.opt,.island,.shop-item button";
function touchUI() {
  let held = null, moved = false, sx = 0, sy = 0;

  const near = el => (el && el.closest) ? el.closest(TAPPABLE) : null;
  const release = () => { if (held) held.classList.remove("pressed"); held = null; };

  document.addEventListener("touchstart", e => {
    const t = near(e.target);
    if (!t || t.disabled) return;
    held = t; moved = false;
    const p = e.touches[0]; sx = p.clientX; sy = p.clientY;
    t.classList.add("pressed");
  }, { passive:true });

  document.addEventListener("touchmove", e => {
    if (!held || moved) return;
    const p = e.touches[0];
    if (Math.abs(p.clientX - sx) > 12 || Math.abs(p.clientY - sy) > 12) {
      moved = true; held.classList.remove("pressed");
    }
  }, { passive:true });

  document.addEventListener("touchend", e => {
    const t = held;
    release();
    if (!t || moved || t.disabled) return;
    if (near(e.target) !== t) return;          // finger slid off the control
    if (e.cancelable) { e.preventDefault(); t.click(); }   // fire now, suppress the ghost click
  }, { passive:false });

  document.addEventListener("touchcancel", release, { passive:true });

  // iOS Safari otherwise zooms on a fast double tap inside the game
  let lastTap = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTap < 320 && near(e.target) && e.cancelable) e.preventDefault();
    lastTap = now;
  }, { passive:false });
}
